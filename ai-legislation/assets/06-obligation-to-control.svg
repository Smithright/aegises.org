<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">From a legal duty to an accountable control</title><desc id="desc">Four selected legal mechanisms mapped to responsible actors, operating actions, proposed evidence objects and redress or reporting routes. Suggested evidence objects are analytical translations, not additional statutory duties.</desc><style>text{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}a:focus rect{stroke:#fff;stroke-width:4}</style>
<rect width="1200" height="790" fill="#f5f6f0"/>
<text x="40" y="42" font-size="12" fill="#597078" font-weight="600" text-anchor="start" class="">AEGISES   /   STATE AI LEGISLATIVE MATURITY   /   FIGURE 06</text>
<text x="40" y="86" font-size="32" fill="#15313d" font-weight="500" text-anchor="start" class="serif">Translate the statute into an accountable control</text>
<text x="40" y="119" font-size="16" fill="#597078" font-weight="400" text-anchor="start" class="">The practical unit: a scoped obligation, an owner, a witnessed action and a route for challenge.</text>
<text x="40" y="169" font-size="15" fill="#087e80" font-weight="600" text-anchor="start" class="">Legal mechanism</text>
<text x="232" y="169" font-size="15" fill="#087e80" font-weight="600" text-anchor="start" class="">Responsible actor</text>
<text x="445" y="169" font-size="15" fill="#087e80" font-weight="600" text-anchor="start" class="">Operating action</text>
<text x="705" y="169" font-size="15" fill="#087e80" font-weight="600" text-anchor="start" class="">Suggested evidence</text>
<text x="988" y="169" font-size="15" fill="#087e80" font-weight="600" text-anchor="start" class="">Challenge / reporting</text>
<rect x="40" y="194" width="1120" height="111" rx="0" fill="#fff" stroke="#d5dfdd"/>
<text x="52" y="225" font-size="16" fill="#087e80" font-weight="600" text-anchor="start" class="">CO · decisions</text>
<text x="244" y="225" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Covered developer /</text>
<text x="244" y="248" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">deployer</text>
<text x="457" y="225" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Document use; explain an</text>
<text x="457" y="248" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">adverse decision; enable</text>
<text x="457" y="271" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">human review.</text>
<text x="717" y="225" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Versioned documentation;</text>
<text x="717" y="248" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">notice receipt; review</text>
<text x="717" y="271" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">disposition.</text>
<text x="1000" y="225" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Consumer review;</text>
<text x="1000" y="248" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Attorney General.</text>
<rect x="40" y="314" width="1120" height="111" rx="0" fill="#fff" stroke="#d5dfdd"/>
<text x="52" y="345" font-size="16" fill="#087e80" font-weight="600" text-anchor="start" class="">IL · employment</text>
<text x="244" y="345" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Covered employer</text>
<text x="457" y="345" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Give required notice and</text>
<text x="457" y="368" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">prevent discriminatory AI</text>
<text x="457" y="391" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">use.</text>
<text x="717" y="345" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Notice record; selection</text>
<text x="717" y="368" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">assessment; accountable</text>
<text x="717" y="391" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">decision owner.</text>
<text x="1000" y="345" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Civil-rights</text>
<text x="1000" y="368" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">complaint process.</text>
<rect x="40" y="434" width="1120" height="111" rx="0" fill="#fff" stroke="#d5dfdd"/>
<text x="52" y="465" font-size="16" fill="#087e80" font-weight="600" text-anchor="start" class="">CA · frontier</text>
<text x="244" y="465" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Covered frontier</text>
<text x="244" y="488" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">developer</text>
<text x="457" y="465" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Maintain applicable</text>
<text x="457" y="488" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">framework and submit</text>
<text x="457" y="511" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">required reports.</text>
<text x="717" y="465" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Published framework; version</text>
<text x="717" y="488" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">history; incident submission</text>
<text x="717" y="511" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">record.</text>
<text x="1000" y="465" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">State reporting;</text>
<text x="1000" y="488" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Attorney General.</text>
<rect x="40" y="554" width="1120" height="111" rx="0" fill="#fff" stroke="#d5dfdd"/>
<text x="52" y="585" font-size="16" fill="#087e80" font-weight="600" text-anchor="start" class="">OH · schools</text>
<text x="244" y="585" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Covered school</text>
<text x="244" y="608" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">governing body</text>
<text x="457" y="585" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Adopt an AI-use policy</text>
<text x="457" y="608" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">after the state model is</text>
<text x="457" y="631" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">issued.</text>
<text x="717" y="585" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Approved policy; adoption</text>
<text x="717" y="608" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">date; assigned school owner.</text>
<text x="1000" y="585" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">Public governance</text>
<text x="1000" y="608" font-size="16" fill="#15313d" font-weight="400" text-anchor="start" class="">and oversight.</text>
<text x="40" y="714" font-size="15" fill="#597078" font-weight="400" text-anchor="start" class="">Evidence objects are AEGISES implementation suggestions. Verify legal coverage, exceptions and procedure first.</text>
