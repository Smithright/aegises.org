<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Maturity requires a chain of evidence</title><desc id="desc">Six evidence stages, from proposal through measured outcomes. Examples establish limited stages for named instruments, not scores for whole states.</desc><style>text{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}a:focus rect{stroke:#fff;stroke-width:4}</style>
<rect width="1200" height="640" fill="#102c39"/>
<text x="40" y="42" font-size="12" fill="#b4c7ca" font-weight="600" text-anchor="start" class="">AEGISES   /   STATE AI LEGISLATIVE MATURITY   /   FIGURE 01</text>
<text x="40" y="86" font-size="32" fill="#f3f5ee" font-weight="500" text-anchor="start" class="serif">From a law on the books to a working institution</text>
<text x="40" y="119" font-size="16" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">An evidence ladder. Each transition needs a different kind of proof.</text>
<rect x="40" y="230" width="177" height="260" rx="0" fill="#173643" stroke="none"/>
<rect x="40" y="230" width="177" height="4" rx="0" fill="#43c1b5" stroke="none"/>
<text x="56" y="269" font-size="18" fill="#7fb1b0" font-weight="400" text-anchor="start" class="">00</text>
<text x="56" y="303" font-size="21" fill="#f3f5ee" font-weight="600" text-anchor="start" class="">Proposed</text>
<text x="56" y="338" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">Bill text and</text>
<text x="56" y="361" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">current status</text>
<text x="56" y="404" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">A prospective date</text>
<text x="56" y="425" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">is not an enacted</text>
<text x="56" y="446" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">duty.</text>
<rect x="228" y="217" width="177" height="260" rx="0" fill="#173643" stroke="none"/>
<rect x="228" y="217" width="177" height="4" rx="0" fill="#43c1b5" stroke="none"/>
<text x="244" y="256" font-size="18" fill="#7fb1b0" font-weight="400" text-anchor="start" class="">01</text>
<text x="244" y="290" font-size="21" fill="#f3f5ee" font-weight="600" text-anchor="start" class="">Enacted</text>
<text x="244" y="325" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">Final act and</text>
<text x="244" y="348" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">signing record</text>
<text x="244" y="391" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">Identify the exact</text>
<text x="244" y="412" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">version and covered</text>
<text x="244" y="433" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">actors.</text>
<rect x="416" y="204" width="177" height="260" rx="0" fill="#173643" stroke="none"/>
<rect x="416" y="204" width="177" height="4" rx="0" fill="#43c1b5" stroke="none"/>
<text x="432" y="243" font-size="18" fill="#7fb1b0" font-weight="400" text-anchor="start" class="">02</text>
<text x="432" y="277" font-size="21" fill="#f3f5ee" font-weight="600" text-anchor="start" class="">Effective</text>
<text x="432" y="312" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">Provision-level</text>
<text x="432" y="335" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">start date</text>
<text x="432" y="378" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">An operative duty</text>
<text x="432" y="399" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">can still lack</text>
<text x="432" y="420" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">delivery evidence.</text>
<rect x="604" y="191" width="177" height="260" rx="0" fill="#173643" stroke="none"/>
<rect x="604" y="191" width="177" height="4" rx="0" fill="#43c1b5" stroke="none"/>
<text x="620" y="230" font-size="18" fill="#7fb1b0" font-weight="400" text-anchor="start" class="">03</text>
<text x="620" y="264" font-size="21" fill="#f3f5ee" font-weight="600" text-anchor="start" class="">Implemented</text>
<text x="620" y="299" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">Published rule,</text>
<text x="620" y="322" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">form or system</text>
<text x="620" y="365" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">An available</text>
<text x="620" y="386" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">artifact does not</text>
<text x="620" y="407" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">prove its use.</text>
<rect x="792" y="178" width="177" height="260" rx="0" fill="#173643" stroke="none"/>
<rect x="792" y="178" width="177" height="4" rx="0" fill="#d4a45d" stroke="none"/>
<text x="808" y="217" font-size="18" fill="#7fb1b0" font-weight="400" text-anchor="start" class="">04</text>
<text x="808" y="251" font-size="21" fill="#f3f5ee" font-weight="600" text-anchor="start" class="">Exercised</text>
<text x="808" y="286" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">Attributable</text>
<text x="808" y="309" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">operational record</text>
<text x="808" y="352" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">Show actual reviews,</text>
<text x="808" y="373" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">notices or remedies.</text>
<rect x="980" y="165" width="177" height="260" rx="0" fill="#173643" stroke="none"/>
<rect x="980" y="165" width="177" height="4" rx="0" fill="#d4a45d" stroke="none"/>
<text x="996" y="204" font-size="18" fill="#7fb1b0" font-weight="400" text-anchor="start" class="">05</text>
<text x="996" y="238" font-size="21" fill="#f3f5ee" font-weight="600" text-anchor="start" class="">Evaluated</text>
<text x="996" y="273" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">Outcomes and a</text>
<text x="996" y="296" font-size="16" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">credible baseline</text>
<text x="996" y="339" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">Test effectiveness,</text>
<text x="996" y="360" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">cost and uneven</text>
<text x="996" y="381" font-size="14" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">impacts.</text>
<text x="40" y="539" font-size="12" fill="#43c1b5" font-weight="600" text-anchor="start" class="">OBSERVED IN THIS REVIEW</text>
<text x="40" y="568" font-size="17" fill="#f3f5ee" font-weight="400" text-anchor="start" class="">CA reporting surface · CT published inventory · OH model policy: implementation artifacts</text>
<text x="40" y="596" font-size="15" fill="#b4c7ca" font-weight="400" text-anchor="start" class="">UT program operation: agency-reported. Comparative outcomes: not evaluated in this edition.</text>
