<text x="40" y="756" font-size="12" fill="#087e80" font-weight="600" text-anchor="start" class="">REACH IS NOT BREADTH OF PROTECTION</text>
<text x="40" y="785" font-size="16" fill="#597078" font-weight="400" text-anchor="start" class="">A frontier law can have deep duties for a narrow developer class. A privacy law can reach many businesses but cover only particular</text>
