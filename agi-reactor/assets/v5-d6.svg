<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1260" role="img" aria-label="A small grammar. An extensible world."><title>A small grammar. An extensible world.</title><desc>Planned architecture. Labels, relationships and evidence limits also appear in the article text.</desc><rect x="0" y="0" width="1600" height="1260" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="0" y="0" width="1600" height="8" fill="#142b38" stroke="#142b38" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="17"><tspan x="48" y="52.15">V5-D6 / REFERENCE DESIGN</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="38"><tspan x="48" y="114.1">A small grammar. An extensible world.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="154.0">Proposed ontology primitives · schema meaning, domain objects and authority have different jobs</tspan></text><rect x="48" y="235" width="470" height="145" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="272.8">Identity</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="308.05">Which object?</tspan><tspan x="66" y="332.75">Stable ID + tenant scope</tspan></text><rect x="565" y="235" width="470" height="145" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="583" y="272.8">Type</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="583" y="308.05">What kind?</tspan><tspan x="583" y="332.75">Versioned schema + meaning</tspan></text><rect x="1082" y="235" width="470" height="145" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="1100" y="272.8">Relation</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1100" y="308.05">How connected?</tspan><tspan x="1100" y="332.75">Typed endpoints + provenance</tspan></text><rect x="305" y="470" width="470" height="145" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="323" y="507.8">Method</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="323" y="543.05">What may be requested?</tspan><tspan x="323" y="567.75">Typed input / output / error / recovery</tspan></text><rect x="825" y="470" width="470" height="145" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="843" y="507.8">Constraint</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="843" y="543.05">What must hold?</tspan><tspan x="843" y="567.75">Cardinality / transition / admission rule</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="435.0">Methods and constraints make the vocabulary operational.</tspan></text><rect x="48" y="695" width="1504" height="105" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="729.05">DOMAIN PROFILES / REUSE THE GRAMMAR</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="765.05">Ticket · agent · edict · skill · service · observation · operation · context frame. Each has a type and an owner.</tspan></text><rect x="48" y="895" width="470" height="140" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="932.8">Structural example</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="968.05">T-42 — assignedTo → AG-7</tspan><tspan x="66" y="992.75">Ticket → Agent; cardinality 0..1</tspan></text><rect x="565" y="895" width="470" height="140" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="583" y="932.8">Operational example</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="583" y="968.05">ticket.assign(ticket, agent, revision)</tspan><tspan x="583" y="992.75">Owning service validates and commits</tspan></text><rect x="1082" y="895" width="470" height="140" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="1100" y="932.8">Authority example</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1100" y="968.05">Caller + action + resource + facts</tspan><tspan x="1100" y="992.75">Active policy evaluated at admission</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="22"><tspan x="48" y="1135.9">Bindings specialize relations. Method definitions and type definitions are themselves versioned objects.</tspan></text><text fill="#346aa0" font-family="Arial,sans-serif" font-size="22"><tspan x="48" y="1180.9">A public vocabulary describes authority. Only an authorized governing operation can change a grant.</tspan></text></svg>