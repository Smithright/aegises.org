<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" role="img" aria-label="The reference machine"><title>The reference machine</title><desc>Planned architecture. Labels, relationships and evidence limits also appear in the article text.</desc><rect x="0" y="0" width="1600" height="1320" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="0" y="0" width="1600" height="8" fill="#142b38" stroke="#142b38" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="17"><tspan x="48" y="52.15">D1 / REFERENCE DESIGN</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="38"><tspan x="48" y="114.1">The reference machine</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="154.0">One governed service model connects intent, cognition, state and external effects.</tspan></text><rect x="48" y="245" width="290" height="155" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="282.8">People / chat / UI</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="318.05">M-17: send the approved</tspan><tspan x="66" y="342.75">report to a named recipient</tspan></text><rect x="425" y="220" width="725" height="370" fill="#f2f6f8" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="19"><tspan x="447" y="255.05">CONTROL / STATE SERVICE</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="18"><tspan x="447" y="287.1">One initial deployment; distinct owned contracts.</tspan></text><rect x="447" y="322" width="326" height="113" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="465" y="359.8">Intake + work</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="465" y="395.05">Ticket T-42 / one assignee</tspan></text><rect x="799" y="322" width="327" height="113" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="817" y="359.8">Policy + bindings</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="817" y="395.05">Identity / active rules</tspan></text><rect x="447" y="457" width="679" height="108" fill="#ffffff" stroke="#a56a25" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="24"><tspan x="465" y="494.8">Attempt + operation admission</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="465" y="530.05">Current generation / immutable OP-9 / budget</tspan></text><polyline points="338,300 425,300" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="414.4690092573155,305.75310646325045 425,300 414.4690092573155,294.24689353674955" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="345" y="284.1">submit</tspan></text><polyline points="425,535 385,535 385,375 338,375" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="348.5309907426845,369.24689353674955 338,375 348.5309907426845,380.75310646325045" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="53" y="452.1">result / unresolved status</tspan></text><rect x="1225" y="245" width="327" height="155" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="1243" y="282.8">NATS / JetStream</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1243" y="318.05">Core: calls and signals</tspan><tspan x="1243" y="342.75">JetStream: durable delivery</tspan></text><polyline points="1150,355 1225,355" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="1214.4690092573155,360.75310646325045 1225,355 1214.4690092573155,349.24689353674955" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="1156" y="343.1">publish</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="48" y="202.05">Commit state + outbox before notification; broker acknowledgment is not work completion.</tspan></text><rect x="48" y="790" width="290" height="140" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="827.8">PostgreSQL</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="863.05">Authoritative records</tspan><tspan x="66" y="887.75">Objects / links / operations</tspan></text><polyline points="425,500 355,500 355,685 190,685 190,790" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="184.24689353674955,779.4690092573155 190,790 195.75310646325045,779.4690092573155" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="65" y="663.1">owns transactions</tspan></text><rect x="425" y="790" width="340" height="140" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="443" y="827.8">Compositor</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="443" y="863.05">Permitted context → frame</tspan></text><polyline points="595,590 595,790" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="589.2468935367496,779.4690092573155 595,790 600.7531064632504,779.4690092573155" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="612" y="706.1">resolve context</tspan></text><rect x="870" y="790" width="280" height="140" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="888" y="827.8">Isolated worker</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="888" y="863.05">Reason / plan / propose</tspan></text><polyline points="765,860 870,860" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="859.4690092573155,865.7531064632504 870,860 859.4690092573155,854.2468935367496" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="788" y="841.1">frame</tspan></text><polyline points="1388,400 1388,620 1010,620 1010,790" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="1004.2468935367496,779.4690092573155 1010,790 1015.7531064632504,779.4690092573155" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="1028" y="766.1">notify</tspan></text><polyline points="870,819 826,819 826,590" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="831.7531064632504,600.5309907426845 826,590 820.2468935367496,600.5309907426845" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="638" y="768.1">claim attempt</tspan></text><rect x="1230" y="790" width="322" height="140" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="1248" y="827.8">Effect boundary</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1248" y="863.05">Service enforcement</tspan><tspan x="1248" y="887.75">+ governed adapter</tspan></text><polyline points="1150,860 1230,860" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="1219.4690092573155,865.7531064632504 1230,860 1219.4690092573155,854.2468935367496" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="1159" y="840.1">invoke</tspan></text><polyline points="1150,515 1197,515 1197,756 1360,756 1360,790" fill="none" stroke="#346aa0" stroke-width="2" stroke-dasharray="8 6"/><polyline points="1354.2468935367497,779.4690092573155 1360,790 1365.7531064632503,779.4690092573155" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="1205" y="737.1">policy + OP-9 admission</tspan></text><rect x="1230" y="1080" width="322" height="124" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="1248" y="1117.8">Target / provider</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1248" y="1153.05">Tool, model or enterprise API</tspan></text><polyline points="1320,930 1320,1080" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="1314.2468935367497,1069.4690092573155 1320,1080 1325.7531064632503,1069.4690092573155" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="1252" y="1024.1">send</tspan></text><polyline points="1450,1080 1450,930" fill="none" stroke="#a56a25" stroke-width="2"/><polyline points="1455.7531064632503,940.5309907426845 1450,930 1444.2468935367497,940.5309907426845" fill="none" stroke="#a56a25" stroke-width="2"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="18"><tspan x="1458" y="1001.1">reply or loss</tspan></text><polyline points="1552,900 1570,900 1570,680 1115,680 1115,590" fill="none" stroke="#a56a25" stroke-width="2"/><polyline points="1120.7531064632503,600.5309907426845 1115,590 1109.2468935367497,600.5309907426845" fill="none" stroke="#a56a25" stroke-width="2"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="18"><tspan x="1235" y="709.1">record result / UNKNOWN</tspan></text><rect x="48" y="1050" width="1060" height="154" fill="#faf4e9" stroke="#a56a25" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="1084.05">HOST + SUPERVISOR / CONTROL BELOW THE MODEL</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="22"><tspan x="68" y="1126.9">Isolation, scoped egress and resource ceilings apply to execution.</tspan><tspan x="68" y="1155.5">Pause blocks new admission; already-admitted operations remain accountable.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="48" y="1263.05">Arrows show logical calls and records. NATS transports crossings; owning services enforce them.</tspan></text><text fill="#147b78" font-family="Arial,sans-serif" font-size="19"><tspan x="48" y="1298.05">Policy, models, learning, release and recovery are capabilities composed through governed services.</tspan></text></svg>