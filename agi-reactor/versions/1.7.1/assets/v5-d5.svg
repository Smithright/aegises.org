<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1310" role="img" aria-label="Information has an owner and a lineage."><title>Information has an owner and a lineage.</title><desc>Planned architecture. Labels, relationships and evidence limits also appear in the article text.</desc><rect x="0" y="0" width="1600" height="1310" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="0" y="0" width="1600" height="8" fill="#142b38" stroke="#142b38" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="17"><tspan x="48" y="52.15">V5-D5 / REFERENCE DESIGN</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="38"><tspan x="48" y="114.1">Information has an owner and a lineage.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="154.0">Planned information architecture · source authority and derived context remain distinct</tspan></text><rect x="48" y="265" width="470" height="160" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="302.8">Authoritative records</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="338.05">Messages / tickets / policy revisions</tspan><tspan x="66" y="362.75">Resources / evidence / operation state</tspan></text><rect x="565" y="265" width="470" height="160" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="583" y="302.8">Discovery projections</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="583" y="338.05">Catalog / search / graph indexes</tspan><tspan x="583" y="362.75">Embeddings / World State views</tspan></text><rect x="1082" y="265" width="470" height="160" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="1100" y="302.8">Composed context</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1100" y="338.05">Source manifest + permitted excerpts</tspan><tspan x="1100" y="362.75">Obligations / constraints / uncertainty</tspan></text><polyline points="518,335 565,335" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="554.4690092573155,340.75310646325045 565,335 554.4690092573155,329.24689353674955" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="1035,335 1082,335" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="1071.4690092573155,340.75310646325045 1082,335 1071.4690092573155,329.24689353674955" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="19"><tspan x="48" y="236.05">01 / OWN + VERSION</tspan></text><text fill="#7751a0" font-family="Arial,sans-serif" font-size="19"><tspan x="565" y="236.05">02 / LOCATE + FILTER</tspan></text><text fill="#7751a0" font-family="Arial,sans-serif" font-size="19"><tspan x="1082" y="236.05">03 / COMPOSE + ATTRIBUTE</tspan></text><rect x="48" y="485" width="1504" height="105" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="519.05">READ AND DISCLOSURE POLICY APPLIES AT EVERY CROSSING</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="555.05">Filter before retrieval and serialization. A cache, embedding or generated summary is not a new permission.</tspan></text><rect x="1082" y="690" width="470" height="160" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="1100" y="727.8">Reasoning + invocation proposal</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1100" y="763.05">Frame informs the model</tspan><tspan x="1100" y="787.75">The service independently admits effects</tspan></text><polyline points="1317,425 1317,485" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="1311.2468935367497,474.4690092573155 1317,485 1322.7531064632503,474.4690092573155" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="1317,590 1317,690" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="1311.2468935367497,679.4690092573155 1317,690 1322.7531064632503,679.4690092573155" fill="none" stroke="#7751a0" stroke-width="2"/><rect x="565" y="690" width="470" height="160" fill="#ffffff" stroke="#a56a25" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="24"><tspan x="583" y="727.8">Attributed result or uncertainty</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="583" y="763.05">Receipt / observation / UNKNOWN</tspan><tspan x="583" y="787.75">Expected vs observed; link to operation</tspan></text><polyline points="1082,770 1035,770" fill="none" stroke="#a56a25" stroke-width="2"/><polyline points="1045.5309907426845,764.2468935367496 1035,770 1045.5309907426845,775.7531064632504" fill="none" stroke="#a56a25" stroke-width="2"/><rect x="48" y="690" width="470" height="160" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="727.8">Commit through the owner</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="763.05">New revision + provenance links</tspan><tspan x="66" y="787.75">Corrections supersede without erasing</tspan></text><polyline points="565,770 518,770" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="528.5309907426845,764.2468935367496 518,770 528.5309907426845,775.7531064632504" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="283,690 283,590" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="288.75310646325045,600.5309907426845 283,590 277.24689353674955,600.5309907426845" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="305" y="659.1">governed write</tspan></text><polyline points="283,485 283,425" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="288.75310646325045,435.5309907426845 283,425 277.24689353674955,435.5309907426845" fill="none" stroke="#147b78" stroke-width="2"/><rect x="48" y="925" width="1504" height="105" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="959.05">A PROJECTION CAN BE REBUILT; AN UNRESOLVED EFFECT CANNOT BE GUESSED</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="995.05">Record source ID + revision, observed time, scope and transformation. Flag stale, partial or conflicting input.</tspan></text><rect x="48" y="1070" width="1504" height="105" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="1104.05">LEARNING IS AN ATTRIBUTED PROPOSAL, WITH A SEPARATE PROMOTION PATH</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="1140.05">A result may suggest a skill, correction or policy revision. Evaluation and authorized promotion govern adoption.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="48" y="1243.05">Source: resource owner     Discovery: permitted view     Frame: bounded working context     Result: accountable evidence</tspan></text></svg>