<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-label="Definitions compose. Obligations endure."><title>Definitions compose. Obligations endure.</title><desc>Planned architecture. Labels, relationships and evidence limits also appear in the article text.</desc><rect x="0" y="0" width="1600" height="1600" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="0" y="0" width="1600" height="8" fill="#142b38" stroke="#142b38" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="17"><tspan x="48" y="52.15">D2 / REFERENCE DESIGN</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="38"><tspan x="48" y="114.1">Definitions compose. Obligations endure.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="154.0">Three views of the same object model · proposed relationships · arrows name the relationship</tspan></text><polyline points="48,194 1552,194" fill="none" stroke="#c9d6db" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="230.0">01</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="25"><tspan x="100" y="232.75">One source can create several durable objects</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="100" y="263.05">Source attribution is preserved; extraction does not activate a policy or assign work.</tspan></text><rect x="60" y="308" width="315" height="105" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="78" y="345.8">Source message</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="78" y="381.05">“Send the approved report.”</tspan></text><rect x="675" y="287" width="305" height="84" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="693" y="324.8">Edict</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="693" y="360.05">Versioned direction</tspan></text><rect x="675" y="397" width="305" height="84" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="693" y="434.8">Ticket</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="693" y="470.05">Durable obligation</tspan></text><polyline points="375,343 520,343 520,329 675,329" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="664.4690092573155,334.75310646325045 675,329 664.4690092573155,323.24689353674955" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="420" y="307.1">yields 0..many</tspan></text><polyline points="375,370 520,370 520,439 675,439" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="664.4690092573155,444.75310646325045 675,439 664.4690092573155,433.24689353674955" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="420" y="465.1">yields 0..many</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="23"><tspan x="1050" y="326.85">Independent relationships</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="1050" y="368.0">The same message may yield both,</tspan><tspan x="1050" y="394.0">either, or several of each.</tspan><tspan x="1050" y="420.0">Each object cites its source.</tspan></text><polyline points="48,516 1552,516" fill="none" stroke="#c9d6db" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="552.0">02</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="25"><tspan x="100" y="554.75">Definitions and authority follow different paths</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="100" y="585.05">Owning services version definitions and bindings. Policy authority remains separately controlled.</tspan></text><rect x="60" y="626" width="235" height="104" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="78" y="663.8">Edict</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="78" y="699.05">Proposed direction</tspan></text><rect x="475" y="626" width="265" height="104" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="493" y="663.8">Policy revision</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="493" y="699.05">Validated rule + scope</tspan></text><rect x="905" y="626" width="260" height="104" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="923" y="663.8">Policy binding</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="923" y="699.05">Rule ↔ typed scope</tspan></text><rect x="1310" y="626" width="230" height="104" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="1328" y="663.8">Enforcer</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1328" y="699.05">Owning service</tspan></text><polyline points="295,678 475,678" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="464.4690092573155,683.7531064632504 475,678 464.4690092573155,672.2468935367496" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="320" y="642.1">authorized</tspan><tspan x="320" y="665.5">promotion</tspan></text><polyline points="740,678 905,678" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="894.4690092573155,683.7531064632504 905,678 894.4690092573155,672.2468935367496" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="770" y="642.1">0..many</tspan><tspan x="770" y="665.5">bindings</tspan></text><polyline points="1165,678 1310,678" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="1299.4690092573155,683.7531064632504 1310,678 1299.4690092573155,672.2468935367496" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="1190" y="660.1">applies at</tspan></text><rect x="60" y="801" width="235" height="112" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="78" y="838.8">Templates</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="78" y="874.05">Examples + edicts</tspan></text><rect x="475" y="801" width="265" height="112" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="493" y="838.8">Skill revision</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="493" y="874.05">Versioned procedure</tspan></text><rect x="905" y="801" width="260" height="112" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="923" y="838.8">Agent type</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="923" y="874.05">Composed profile</tspan></text><rect x="1310" y="801" width="230" height="112" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="1328" y="838.8">Agent</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1328" y="874.05">Stable identity</tspan></text><polyline points="295,857 475,857" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="464.4690092573155,862.7531064632504 475,857 464.4690092573155,851.2468935367496" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="320" y="822.1">0..many</tspan><tspan x="320" y="845.5">source links</tspan></text><polyline points="740,857 905,857" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="894.4690092573155,862.7531064632504 905,857 894.4690092573155,851.2468935367496" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="757" y="822.1">0..many</tspan><tspan x="757" y="845.5">skill bindings</tspan></text><polyline points="1165,857 1310,857" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="1299.4690092573155,862.7531064632504 1310,857 1299.4690092573155,851.2468935367496" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="1190" y="839.1">classifies</tspan></text><text fill="#346aa0" font-family="Arial,sans-serif" font-size="22"><tspan x="60" y="961.9">Skill ≠ grant</tspan></text><text fill="#7751a0" font-family="Arial,sans-serif" font-size="22"><tspan x="475" y="961.9">Type ≠ identity</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="905" y="960.0">Bindings are typed links; definitions are not processes.</tspan></text><polyline points="48,998 1552,998" fill="none" stroke="#c9d6db" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="1034.0">03</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="25"><tspan x="100" y="1036.75">Execution changes; identity and effect intent survive</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="100" y="1067.05">Control/state service owns ticket, attempt and operation records/admission. Adapters enforce admitted calls.</tspan></text><rect x="60" y="1102" width="315" height="143" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="78" y="1139.8">Ticket</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="78" y="1175.05">Acceptance + revision</tspan><tspan x="78" y="1199.75">Durable result / recovery</tspan></text><rect x="590" y="1102" width="335" height="143" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="608" y="1139.8">Attempts</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="608" y="1175.05">0..many over ticket lifetime</tspan><tspan x="608" y="1199.75">At most one current attempt</tspan></text><rect x="1135" y="1102" width="405" height="143" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="1153" y="1139.8">Operation</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1153" y="1175.05">The workflow step retains its ID</tspan><tspan x="1153" y="1199.75">Original intent is immutable</tspan></text><polyline points="375,1168 590,1168" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="579.4690092573155,1173.7531064632503 590,1168 579.4690092573155,1162.2468935367497" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="402" y="1150.1">records attempts</tspan></text><polyline points="925,1168 1135,1168" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="1124.4690092573155,1173.7531064632503 1135,1168 1124.4690092573155,1162.2468935367497" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="955" y="1127.1">authorized custody</tspan><tspan x="955" y="1150.5">may transfer</tspan></text><rect x="60" y="1359" width="315" height="90" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="78" y="1396.8">Agent</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="78" y="1432.05">Same identity as above</tspan></text><polyline points="215,1245 215,1359" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="209.24689353674955,1348.4690092573155 215,1359 220.75310646325045,1348.4690092573155" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="239" y="1308.1">assigned to 0..1</tspan></text><rect x="590" y="1359" width="335" height="90" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="608" y="1396.8">Resource revision</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="608" y="1432.05">Checked by owning service</tspan></text><polyline points="757,1245 757,1359" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="751.2468935367496,1348.4690092573155 757,1359 762.7531064632504,1348.4690092573155" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="778" y="1297.1">invocation carries</tspan><tspan x="778" y="1320.5">expected revision</tspan></text><rect x="1135" y="1359" width="405" height="90" fill="#ffffff" stroke="#a56a25" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="24"><tspan x="1153" y="1396.8">Evidence</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1153" y="1432.05">Receipt, failure or UNKNOWN</tspan></text><polyline points="1337,1245 1337,1359" fill="none" stroke="#a56a25" stroke-width="2"/><polyline points="1331.2468935367497,1348.4690092573155 1337,1359 1342.7531064632503,1348.4690092573155" fill="none" stroke="#a56a25" stroke-width="2"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="18"><tspan x="1358" y="1308.1">has 0..many</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="21"><tspan x="60" y="1499.95">One assignee does not lock shared resources.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="60" y="1538.05">Concurrent tickets still require resource-level revision checks or transactions.</tspan></text><text fill="#147b78" font-family="Arial,sans-serif" font-size="20"><tspan x="845" y="1499.0">An operation binds tenant, caller, method, target</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="845" y="1538.05">and canonical argument digest. Takeover cannot change them.</tspan></text></svg>