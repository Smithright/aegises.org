<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" role="img" aria-label="The system, at a glance."><title>The system, at a glance.</title><desc>Planned architecture. Labels, relationships and evidence limits also appear in the article text.</desc><rect x="0" y="0" width="1600" height="1110" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="0" y="0" width="1600" height="8" fill="#142b38" stroke="#142b38" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="17"><tspan x="48" y="52.15">V5-D0 / REFERENCE DESIGN</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="38"><tspan x="48" y="114.1">The system, at a glance.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="154.0">Planned reference architecture · durable work, replaceable execution, governed effects</tspan></text><rect x="48" y="220" width="350" height="150" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="257.8">People + connected systems</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="293.05">Chat / UI / CLI / events</tspan><tspan x="66" y="317.75">Request, observe, interrupt</tspan></text><rect x="535" y="220" width="490" height="150" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="553" y="257.8">Control + authoritative state</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="553" y="293.05">Tickets / assignments / attempts</tspan><tspan x="553" y="317.75">Policy / budget / operation ledger</tspan></text><rect x="1162" y="220" width="390" height="150" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="1180" y="257.8">Enterprise services</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1180" y="293.05">Typed methods / owned resources</tspan><tspan x="1180" y="317.75">Models, tools, data and delivery</tspan></text><polyline points="398,290 535,290" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="524.4690092573155,295.75310646325045 535,290 524.4690092573155,284.24689353674955" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="425" y="273.1">intent</tspan></text><polyline points="1025,290 1162,290" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="1151.4690092573155,295.75310646325045 1162,290 1151.4690092573155,284.24689353674955" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="1060" y="273.1">admit</tspan></text><rect x="48" y="525" width="350" height="155" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="562.8">Information services</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="598.05">Sources / types / links / provenance</tspan><tspan x="66" y="622.75">Catalogs and rebuildable indexes</tspan></text><rect x="535" y="525" width="490" height="155" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="553" y="562.8">Compositor + agent workers</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="553" y="598.05">Permitted context → reason → propose</tspan><tspan x="553" y="622.75">Identity survives worker replacement</tspan></text><rect x="1162" y="525" width="390" height="155" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="1180" y="562.8">Effect enforcement</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1180" y="598.05">Check current admission</tspan><tspan x="1180" y="622.75">Send / reconcile / record outcome</tspan></text><polyline points="398,605 535,605" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="524.4690092573155,610.7531064632504 535,605 524.4690092573155,599.2468935367496" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="415" y="587.1">context</tspan></text><polyline points="780,525 780,370" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="785.7531064632504,380.5309907426845 780,370 774.2468935367496,380.5309907426845" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="804" y="470.1">claim + propose</tspan></text><polyline points="1357,370 1357,525" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="1351.2468935367497,514.4690092573155 1357,525 1362.7531064632503,514.4690092573155" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="1380" y="468.1">governed call</tspan></text><polyline points="1162,640 1090,640 1090,433 1010,433 1010,370" fill="none" stroke="#a56a25" stroke-width="2"/><polyline points="1015.7531064632504,380.5309907426845 1010,370 1004.2468935367496,380.5309907426845" fill="none" stroke="#a56a25" stroke-width="2"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="18"><tspan x="1106" y="492.1">result / UNKNOWN</tspan></text><polyline points="245,525 245,437 550,437 550,370" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="555.7531064632504,380.5309907426845 550,370 544.2468935367496,380.5309907426845" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="53" y="417.1">read / revise through owning service</tspan></text><rect x="48" y="775" width="1504" height="105" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="809.05">COMMUNICATION KERNEL / NATS + JETSTREAM</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="845.05">NATS carries calls and chat. JetStream delivers durable notifications. Neither owns ticket assignment.</tspan></text><rect x="48" y="920" width="1504" height="105" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="954.05">HOST + SUPERVISOR / INDEPENDENT CONTROL</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="19"><tspan x="68" y="990.05">Contain execution, scope egress, enforce resource ceilings, stop admission and preserve recovery.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="48" y="1073.05">One control/state service is a viable start. A box denotes a responsibility; it need not be a separate process.</tspan></text></svg>