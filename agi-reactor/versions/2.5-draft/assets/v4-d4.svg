<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1760" role="img" aria-label="One operation through time."><title>One operation through time.</title><desc>Planned architecture. Labels, relationships and evidence limits also appear in the article text.</desc><rect x="0" y="0" width="1600" height="1760" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="0" y="0" width="1600" height="8" fill="#142b38" stroke="#142b38" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="17"><tspan x="48" y="52.15">D4 / REFERENCE DESIGN</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="38"><tspan x="48" y="114.1">One operation through time.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="154.0">A response can reach a worker while the durable obligation remains unresolved.</tspan></text><rect x="48" y="186" width="1504" height="62" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="23"><tspan x="68" y="225.85">M-17 message  →  T-42 ticket / STEP-1 logical step  →  A-3 attempt  →  OP-9 operation</tspan></text><rect x="48" y="273" width="480" height="156" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="310.8">01  Accept into durable custody</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="346.05">Chat M-17 arrives through NATS.</tspan><tspan x="66" y="370.75">Commit T-42 + source link + outbox</tspan><tspan x="66" y="395.45">before reporting acceptance.</tspan></text><rect x="560" y="273" width="480" height="156" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="578" y="310.8">02  Dispatch durable notification</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="578" y="346.05">Publish committed outbox to JetStream.</tspan><tspan x="578" y="370.75">Reuse the same event identity.</tspan><tspan x="578" y="395.45">Dispatch does not confer execution rights.</tspan></text><rect x="1072" y="273" width="480" height="156" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="1090" y="310.8">03  Acquire current attempt</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1090" y="346.05">Deduplicate; atomically claim A-3.</tspan><tspan x="1090" y="370.75">T-42 assignee: Agent AG-7.</tspan><tspan x="1090" y="395.45">Commit execution custody before ACK.</tspan></text><polyline points="528,350 560,350" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="549.4690092573155,355.75310646325045 560,350 549.4690092573155,344.24689353674955" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="1040,350 1072,350" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="1061.4690092573155,355.75310646325045 1072,350 1061.4690092573155,344.24689353674955" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#142b38" font-family="Arial,sans-serif" font-size="21" font-weight="600"><tspan x="48" y="465.95">ACKNOWLEDGMENT ≠ COMPLETION</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="620" y="467.0">T-42 remains the durable obligation after broker acknowledgment.</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="23"><tspan x="74" y="520.85">Worker / attempt A-3</tspan></text><polyline points="224,543 224,1124" fill="none" stroke="#c9d6db" stroke-width="2" stroke-dasharray="8 6"/><text fill="#142b38" font-family="Arial,sans-serif" font-size="23"><tspan x="648" y="520.85">Control / effect service</tspan></text><polyline points="798,543 798,1124" fill="none" stroke="#c9d6db" stroke-width="2" stroke-dasharray="8 6"/><text fill="#142b38" font-family="Arial,sans-serif" font-size="23"><tspan x="1192" y="520.85">External target</tspan></text><polyline points="1342,543 1342,1124" fill="none" stroke="#c9d6db" stroke-width="2" stroke-dasharray="8 6"/><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="50" y="559.05">TIME ↓</tspan></text><polyline points="798,583 224,583" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="234.53099074268448,577.2468935367496 224,583 234.53099074268448,588.7531064632504" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="20"><tspan x="290" y="570.0">A-3 custody committed; bounded execution begins</tspan></text><polyline points="224,643 798,643" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="787.4690092573155,648.7531064632504 798,643 787.4690092573155,637.2468935367496" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="20"><tspan x="283" y="630.0">Request OP-9 for logical step T-42 / STEP-1</tspan></text><rect x="570" y="662" width="458" height="93" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="588" y="699.8">Commit OP-9 admission</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="588" y="735.05">Bind immutable intent; serialize custody.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="700.0">Intent = tenant + original caller + method</tspan><tspan x="48" y="726.0">+ target + canonical argument digest</tspan></text><rect x="570" y="780" width="458" height="68" fill="#fff5e8" stroke="#a56a25" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="23"><tspan x="590" y="818.85">Commit UNKNOWN before sending</tspan></text><polyline points="1028,813 1342,813" fill="none" stroke="#a56a25" stroke-width="2"/><polyline points="1331.4690092573155,818.7531064632504 1342,813 1331.4690092573155,807.2468935367496" fill="none" stroke="#a56a25" stroke-width="2"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="20"><tspan x="1060" y="800.0">Adapter sends</tspan></text><rect x="1132" y="842" width="420" height="65" fill="#f2f6f8" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="22"><tspan x="1150" y="881.9">Target commits exactly one effect</tspan></text><polyline points="1342,938 224,938" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="234.53099074268448,932.2468935367496 224,938 234.53099074268448,943.7531064632504" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="20"><tspan x="475" y="927.0">HTTP 200 reaches worker; result has not been committed</tspan></text><rect x="48" y="962" width="354" height="93" fill="#ffffff" stroke="#a56a25" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="999.8">Worker crashes after 200</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="1035.05">No success result is saved.</tspan></text><rect x="570" y="962" width="458" height="93" fill="#ffffff" stroke="#a56a25" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="24"><tspan x="588" y="999.8">Controller knows: UNKNOWN</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="588" y="1035.05">It cannot infer success or safe retry.</tspan></text><rect x="1132" y="962" width="420" height="93" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="1150" y="999.8">External reality: one effect</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1150" y="1035.05">Only the test oracle can count it.</tspan></text><rect x="570" y="1080" width="458" height="68" fill="#f2f6f8" stroke="#c9d6db" stroke-width="1.5"/><text fill="#142b38" font-family="Arial,sans-serif" font-size="23"><tspan x="590" y="1115.85">Backup contains UNKNOWN</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="590" y="1140.05">Taken after the external effect.</tspan></text><polyline points="798,1055 798,1080" fill="none" stroke="#a56a25" stroke-width="2"/><polyline points="792.2468935367496,1069.4690092573155 798,1080 803.7531064632504,1069.4690092573155" fill="none" stroke="#a56a25" stroke-width="2"/><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="1109.0">No transaction spans the controller</tspan><tspan x="48" y="1135.0">and this non-idempotent target.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="1132" y="1107.0">No idempotency key.</tspan><tspan x="1132" y="1133.0">No target status lookup.</tspan></text><polyline points="48,1190 1552,1190" fill="none" stroke="#c9d6db" stroke-width="2"/><text fill="#142b38" font-family="Arial,sans-serif" font-size="23" font-weight="600"><tspan x="48" y="1231.85">RESTORE CONTROL STATE; DO NOT RESTORE EXTERNAL REALITY</tspan></text><rect x="48" y="1260" width="480" height="189" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="1297.8">Fence admission</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="1333.05">Establish epoch 2 + recovery hold</tspan><tspan x="66" y="1357.75">outside the restored database.</tspan><tspan x="66" y="1382.45">Epoch 1 is refused: STALE_EPOCH.</tspan><tspan x="66" y="1407.15">T-42 → NEEDS_RECONCILIATION.</tspan></text><rect x="560" y="1260" width="480" height="189" fill="#ffffff" stroke="#a56a25" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="24"><tspan x="578" y="1297.8">Preserve unresolved identity</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="578" y="1333.05">OP-9 stays UNKNOWN.</tspan><tspan x="578" y="1357.75">Replay returns OUTCOME_UNKNOWN.</tspan><tspan x="578" y="1382.45">Replacement ID for STEP-1 is refused.</tspan><tspan x="578" y="1407.15">A new attempt grants no replay right.</tspan><tspan x="578" y="1431.85">Changed intent is INTENT_MISMATCH.</tspan></text><rect x="1072" y="1260" width="480" height="189" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="1090" y="1297.8">Give uncertainty an owner</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1090" y="1333.05">Assign an authorized reconciler.</tspan><tspan x="1090" y="1357.75">Inspect · record finding · escalate.</tspan><tspan x="1090" y="1382.45">Without admissible evidence, stop.</tspan><tspan x="1090" y="1407.15">No ordinary Retry; preserve OP-9.</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="22"><tspan x="48" y="1489.9">After hold release, the per-operation guard must still refuse blind replay.</tspan></text><rect x="48" y="1520" width="736" height="177" fill="#eef7f5" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="20"><tspan x="68" y="1557.0">RFC-001 / OBSERVED REFERENCE SPECIMEN</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="20"><tspan x="68" y="1596.0">Local HTTP + SQLite + actual worker crash after 200.</tspan><tspan x="68" y="1622.0">Guarded restore: 1 effect, 0 duplicates, still UNKNOWN.</tspan><tspan x="68" y="1648.0">Unsafe reset: 2 effects; the safety assertion fails.</tspan></text><rect x="808" y="1520" width="744" height="177" fill="#f2f6f8" stroke="#c9d6db" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="20"><tspan x="828" y="1557.0">PLANNED / REQUIRES DEPLOYMENT QUALIFICATION</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="20"><tspan x="828" y="1596.0">NATS / PostgreSQL, concurrent controllers, real identity</tspan><tspan x="828" y="1622.0">and containment are not exercised by this specimen.</tspan><tspan x="828" y="1648.0">A backup predating OP-9 requires an additional test.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="48" y="1738.05">M-17 / T-42 / A-3 / OP-9 are diagram aliases; RFC-001 publishes its exact fixture identities and evidence.</tspan></text></svg>