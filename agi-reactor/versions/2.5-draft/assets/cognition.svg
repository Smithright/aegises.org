<svg xmlns="http://www.w3.org/2000/svg" viewBox="4500 23250 1950 2250" role="img" aria-label="V3.B3 / Cognition &amp; learning"><title>V3.B3 / Cognition &amp; learning</title><desc>Planned architecture. The full contracts and equivalent text are documented on this page.</desc><rect x="4500" y="23250" width="1950" height="2250" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="4500" y="23250" width="1950" height="12" fill="#7751a0" stroke="#7751a0" stroke-width="2"/><text x="4570" y="23341.4" fill="#7751a0" font-family="Arial, sans-serif" font-size="46"><tspan x="4570" dy="0">V3.B3</tspan></text><text x="4570" y="23433.6" fill="#142b38" font-family="Arial, sans-serif" font-size="54"><tspan x="4570" dy="0">Cognition &amp; learning</tspan></text><text x="4570" y="23493.4" fill="#637680" font-family="Arial, sans-serif" font-size="26"><tspan x="4570" dy="0">Intelligence is a loop with memory, evaluation and stopping conditions.</tspan></text><a href="https://aegises.org/agi-reactor/#architecture"><text x="6050" y="23339.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="6050" dy="0">V3.B / OVERVIEW</tspan></text></a><text x="4570" y="23620.7" fill="#7751a0" font-family="Arial, sans-serif" font-size="23"><tspan x="4570" dy="0">OBSERVE → BUILD A VIEW → CHOOSE</tspan></text><rect x="4570.0" y="23655" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="4570.0" y="23655" width="6" height="160" fill="#7751a0" stroke="#7751a0" stroke-width="2"/><text x="4598.0" y="23704.2" fill="#7751a0" font-family="Arial, sans-serif" font-size="28"><tspan x="4598.0" dy="0">Perceive</tspan></text><text x="4598.0" y="23765.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598.0" dy="0">Attributed observations</tspan></text><rect x="5193.333333333333" y="23655" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="5193.333333333333" y="23655" width="6" height="160" fill="#7751a0" stroke="#7751a0" stroke-width="2"/><text x="5221.333333333333" y="23704.2" fill="#7751a0" font-family="Arial, sans-serif" font-size="28"><tspan x="5221.333333333333" dy="0">Compose</tspan></text><text x="5221.333333333333" y="23765.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5221.333333333333" dy="0">Scoped, bounded frame</tspan></text><rect x="5816.666666666667" y="23655" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="5816.666666666667" y="23655" width="6" height="160" fill="#7751a0" stroke="#7751a0" stroke-width="2"/><text x="5844.666666666667" y="23704.2" fill="#7751a0" font-family="Arial, sans-serif" font-size="28"><tspan x="5844.666666666667" dy="0">Reason</tspan></text><text x="5844.666666666667" y="23765.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5844.666666666667" dy="0">Hypotheses + plans</tspan></text><polyline points="5133.333333333333,23735.0 5193.333333333333,23735.0" fill="none" stroke="#7751a0" stroke-width="3"/><polyline points="5178.414429781196,23743.15023415627 5193.333333333333,23735.0 5178.414429781196,23726.84976584373" fill="none" stroke="#7751a0" stroke-width="3"/><polyline points="5756.666666666666,23735.0 5816.666666666667,23735.0" fill="none" stroke="#7751a0" stroke-width="3"/><polyline points="5801.74776311453,23743.15023415627 5816.666666666667,23735.0 5801.74776311453,23726.84976584373" fill="none" stroke="#7751a0" stroke-width="3"/><text x="4570" y="23980.7" fill="#2f7959" font-family="Arial, sans-serif" font-size="23"><tspan x="4570" dy="0">ACT → COMPARE → LEARN</tspan></text><rect x="4570.0" y="24015" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="4570.0" y="24015" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="4598.0" y="24064.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="4598.0" dy="0">Invoke</tspan></text><text x="4598.0" y="24125.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598.0" dy="0">Service admission</tspan></text><rect x="5193.333333333333" y="24015" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="5193.333333333333" y="24015" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="5221.333333333333" y="24064.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="5221.333333333333" dy="0">Evaluate</tspan></text><text x="5221.333333333333" y="24125.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5221.333333333333" dy="0">Expected vs observed</tspan></text><rect x="5816.666666666667" y="24015" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="5816.666666666667" y="24015" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="5844.666666666667" y="24064.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="5844.666666666667" dy="0">Consolidate</tspan></text><text x="5844.666666666667" y="24125.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5844.666666666667" dy="0">Versioned corrections</tspan></text><polyline points="5133.333333333333,24095.0 5193.333333333333,24095.0" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="5178.414429781196,24103.15023415627 5193.333333333333,24095.0 5178.414429781196,24086.84976584373" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="5756.666666666666,24095.0 5816.666666666667,24095.0" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="5801.74776311453,24103.15023415627 5816.666666666667,24095.0 5801.74776311453,24086.84976584373" fill="none" stroke="#2f7959" stroke-width="3"/><rect x="4570" y="24330" width="865" height="390" fill="#f5f1fa" stroke="#cad7dd" stroke-width="2"/><rect x="4570" y="24330" width="6" height="390" fill="#7751a0" stroke="#7751a0" stroke-width="2"/><text x="4598" y="24381.9" fill="#7751a0" font-family="Arial, sans-serif" font-size="31"><tspan x="4598" dy="0">Compositor contract</tspan></text><text x="4598" y="24440.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">Principal + ticket + permitted sources</tspan><tspan x="4598" dy="33.75">Intent · acceptance · applicable edicts</tspan><tspan x="4598" dy="33.75">Assignee · attempt · pending operations</tspan><tspan x="4598" dy="33.75">Return point · ranked optional context</tspan><tspan x="4598" dy="33.75">Manifest: source revisions + compiler</tspan><tspan x="4598" dy="33.75">Missing required input is explicit.</tspan></text><rect x="5515" y="24330" width="865" height="390" fill="#f2f6f8" stroke="#cad7dd" stroke-width="2"/><rect x="5515" y="24330" width="6" height="390" fill="#346aa0" stroke="#346aa0" stroke-width="2"/><text x="5543" y="24381.9" fill="#346aa0" font-family="Arial, sans-serif" font-size="31"><tspan x="5543" dy="0">Knowledge contract</tspan></text><text x="5543" y="24440.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5543" dy="0">Observations retain time and source.</tspan><tspan x="5543" dy="33.75">Hypotheses retain uncertainty.</tspan><tspan x="5543" dy="33.75">Conflicts and corrections stay linked.</tspan><tspan x="5543" dy="33.75">A model summary is derived content.</tspan><tspan x="5543" dy="33.75">Access applies before serialization.</tspan><tspan x="5543" dy="33.75">Frames do not grant capabilities.</tspan></text><rect x="4570" y="24830" width="1810" height="320" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="4570" y="24830" width="6" height="320" fill="#7751a0" stroke="#7751a0" stroke-width="2"/><text x="4598" y="24883.7" fill="#7751a0" font-family="Arial, sans-serif" font-size="33"><tspan x="4598" dy="0">Learning earns promotion</tspan></text><text x="4598" y="24940.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">Skills, memory procedures and model routes evolve through representative evaluation.</tspan><tspan x="4598" dy="33.75">Compare task quality, cost and recovery against a baseline. Retain a usable old version.</tspan><tspan x="4598" dy="33.75">Learned guidance may propose policy changes; it cannot grant itself authority.</tspan><tspan x="4598" dy="33.75">Start with deterministic assembly; add sophistication only for measured benefit.</tspan></text><rect x="4570" y="25260" width="1810" height="170" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="4598" y="25302.7" fill="#7751a0" font-family="Arial, sans-serif" font-size="23"><tspan x="4598" dy="0">HUMAN + AGENT CONTROL</tspan></text><text x="4598" y="25351.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">The loop may wait, ask, stop or resume. Budget limits are mechanically enforced.</tspan><tspan x="4598" dy="33.75">A returning agent recovers obligations and uncertainty before admitting another effect.</tspan></text></svg>