<svg xmlns="http://www.w3.org/2000/svg" viewBox="6550 25980 1950 2250" role="img" aria-label="V3.B6 / Prove the whole system"><title>V3.B6 / Prove the whole system</title><desc>Planned architecture. The full contracts and equivalent text are documented on this page.</desc><rect x="6550" y="25980" width="1950" height="2250" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="6550" y="25980" width="1950" height="12" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="6620" y="26071.4" fill="#147b78" font-family="Arial, sans-serif" font-size="46"><tspan x="6620" dy="0">V3.B6</tspan></text><text x="6620" y="26163.6" fill="#142b38" font-family="Arial, sans-serif" font-size="54"><tspan x="6620" dy="0">Prove the whole system</tspan></text><text x="6620" y="26223.4" fill="#637680" font-family="Arial, sans-serif" font-size="26"><tspan x="6620" dy="0">A useful end-to-end outcome is the unit of progress.</tspan></text><a href="https://aegises.org/agi-reactor/#architecture"><text x="8100" y="26069.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="8100" dy="0">V3.B / OVERVIEW</tspan></text></a><rect x="6620" y="26330" width="1810" height="145" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="6650" y="26392.0" fill="#147b78" font-family="Arial, sans-serif" font-size="40"><tspan x="6650" dy="0">01</tspan></text><text x="6770" y="26380.8" fill="#147b78" font-family="Arial, sans-serif" font-size="32"><tspan x="6770" dy="0">Receive &amp; resume</tspan></text><text x="6770" y="26432.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6770" dy="0">Accept a real request; lose the reply; recover the same ticket.</tspan></text><rect x="6620" y="26505" width="1810" height="145" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="6650" y="26567.0" fill="#147b78" font-family="Arial, sans-serif" font-size="40"><tspan x="6650" dy="0">02</tspan></text><text x="6770" y="26555.8" fill="#147b78" font-family="Arial, sans-serif" font-size="32"><tspan x="6770" dy="0">Coordinate &amp; bound</tspan></text><text x="6770" y="26607.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6770" dy="0">Race workers, enforce one current attempt and a real budget.</tspan></text><rect x="6620" y="26680" width="1810" height="145" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="6650" y="26742.0" fill="#147b78" font-family="Arial, sans-serif" font-size="40"><tspan x="6650" dy="0">03</tspan></text><text x="6770" y="26730.8" fill="#147b78" font-family="Arial, sans-serif" font-size="32"><tspan x="6770" dy="0">Know &amp; reason</tspan></text><text x="6770" y="26782.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6770" dy="0">Compose permitted context; preserve contradiction; make a useful plan.</tspan></text><rect x="6620" y="26855" width="1810" height="145" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="6650" y="26917.0" fill="#147b78" font-family="Arial, sans-serif" font-size="40"><tspan x="6650" dy="0">04</tspan></text><text x="6770" y="26905.8" fill="#147b78" font-family="Arial, sans-serif" font-size="32"><tspan x="6770" dy="0">Act &amp; reconcile</tspan></text><text x="6770" y="26957.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6770" dy="0">Crash after target acceptance; recover the original operation.</tspan></text><rect x="6620" y="27030" width="1810" height="145" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="6650" y="27092.0" fill="#147b78" font-family="Arial, sans-serif" font-size="40"><tspan x="6650" dy="0">05</tspan></text><text x="6770" y="27080.8" fill="#147b78" font-family="Arial, sans-serif" font-size="32"><tspan x="6770" dy="0">Stop &amp; govern</tspan></text><text x="6770" y="27132.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6770" dy="0">Pause new work; deny expired authority and exhausted allowance.</tspan></text><rect x="6620" y="27205" width="1810" height="145" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="6650" y="27267.0" fill="#147b78" font-family="Arial, sans-serif" font-size="40"><tspan x="6650" dy="0">06</tspan></text><text x="6770" y="27255.8" fill="#147b78" font-family="Arial, sans-serif" font-size="32"><tspan x="6770" dy="0">Evolve &amp; recover</tspan></text><text x="6770" y="27307.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6770" dy="0">Canary a service change; fail it; use the checked hot fallback.</tspan></text><rect x="6620" y="27380" width="1810" height="145" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="6650" y="27442.0" fill="#147b78" font-family="Arial, sans-serif" font-size="40"><tspan x="6650" dy="0">07</tspan></text><text x="6770" y="27430.8" fill="#147b78" font-family="Arial, sans-serif" font-size="32"><tspan x="6770" dy="0">Deliver &amp; learn</tspan></text><text x="6770" y="27482.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6770" dy="0">Recipient uses the result; evaluate a source-linked lesson.</tspan></text><rect x="6620" y="27555" width="1810" height="145" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="6650" y="27617.0" fill="#147b78" font-family="Arial, sans-serif" font-size="40"><tspan x="6650" dy="0">08</tspan></text><text x="6770" y="27605.8" fill="#147b78" font-family="Arial, sans-serif" font-size="32"><tspan x="6770" dy="0">Restore &amp; continue</tspan></text><text x="6770" y="27657.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6770" dy="0">Block effects; exclude old workers; reconcile outcomes and revocations.</tspan></text><rect x="6620" y="27790" width="1810" height="185" fill="#edf6f3" stroke="#cad7dd" stroke-width="2"/><rect x="6620" y="27790" width="6" height="185" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="6648" y="27843.7" fill="#147b78" font-family="Arial, sans-serif" font-size="33"><tspan x="6648" dy="0">Measure usefulness and control together</tspan></text><text x="6648" y="27900.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648" dy="0">Task quality · latency · total cost · recovery time · duplicate effects · recipient acceptance</tspan></text><text x="6620" y="28074.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="6620" dy="0">PUBLIC ACCEPTANCE / aegises.org/agi-reactor</tspan></text><text x="6620" y="28124.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6620" dy="0">An outside human or AI can reconstruct the system, its safety contracts and its limits.</tspan></text></svg>