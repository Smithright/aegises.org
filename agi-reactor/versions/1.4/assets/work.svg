<svg xmlns="http://www.w3.org/2000/svg" viewBox="6550 20520 1950 2250" role="img" aria-label="V3.B2 / Work &amp; concurrency"><title>V3.B2 / Work &amp; concurrency</title><desc>Planned architecture. The full contracts and equivalent text are documented on this page.</desc><rect x="6550" y="20520" width="1950" height="2250" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="6550" y="20520" width="1950" height="12" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="6620" y="20611.4" fill="#2f7959" font-family="Arial, sans-serif" font-size="46"><tspan x="6620" dy="0">V3.B2</tspan></text><text x="6620" y="20703.6" fill="#142b38" font-family="Arial, sans-serif" font-size="54"><tspan x="6620" dy="0">Work &amp; concurrency</tspan></text><text x="6620" y="20763.4" fill="#637680" font-family="Arial, sans-serif" font-size="26"><tspan x="6620" dy="0">One assigned agent. Recoverable work behind that simple rule.</tspan></text><a href="https://aegises.org/agi-reactor/#architecture"><text x="8100" y="20609.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="8100" dy="0">V3.B / OVERVIEW</tspan></text></a><text x="6620" y="20890.7" fill="#2f7959" font-family="Arial, sans-serif" font-size="23"><tspan x="6620" dy="0">DURABLE WORK / PROMOTE IPC WHEN A COMMITMENT NEEDS TO SURVIVE</tspan></text><rect x="6620.0" y="20925" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="6620.0" y="20925" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="6648.0" y="20974.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="6648.0" dy="0">Accept</tspan></text><text x="6648.0" y="21035.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648.0" dy="0">Intent + acceptance</tspan></text><rect x="7243.333333333333" y="20925" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="7243.333333333333" y="20925" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="7271.333333333333" y="20974.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="7271.333333333333" dy="0">Assign</tspan></text><text x="7271.333333333333" y="21035.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7271.333333333333" dy="0">One agent or none</tspan></text><rect x="7866.666666666667" y="20925" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="7866.666666666667" y="20925" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="7894.666666666667" y="20974.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="7894.666666666667" dy="0">Run</tspan></text><text x="7894.666666666667" y="21035.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7894.666666666667" dy="0">One current attempt</tspan></text><polyline points="7183.333333333333,21005.0 7243.333333333333,21005.0" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="7228.414429781196,21013.15023415627 7243.333333333333,21005.0 7228.414429781196,20996.84976584373" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="7806.666666666666,21005.0 7866.666666666667,21005.0" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="7851.74776311453,21013.15023415627 7866.666666666667,21005.0 7851.74776311453,20996.84976584373" fill="none" stroke="#2f7959" stroke-width="3"/><rect x="6620" y="21220" width="865" height="340" fill="#edf6f3" stroke="#cad7dd" stroke-width="2"/><rect x="6620" y="21220" width="6" height="340" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="6648" y="21271.9" fill="#2f7959" font-family="Arial, sans-serif" font-size="31"><tspan x="6648" dy="0">Ticket / durable abstraction</tspan></text><text x="6648" y="21330.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648" dy="0">Identity · assignee · state · priority</tspan><tspan x="6648" dy="33.75">Acceptance · links · result · return point</tspan><tspan x="6648" dy="33.75">Dependencies coordinate separate tickets.</tspan><tspan x="6648" dy="33.75">Routines and reactions create or wake work.</tspan><tspan x="6648" dy="33.75">Pause / cancel / deadlines are explicit.</tspan></text><rect x="7565" y="21220" width="865" height="340" fill="#faf4e9" stroke="#cad7dd" stroke-width="2"/><rect x="7565" y="21220" width="6" height="340" fill="#a56a25" stroke="#a56a25" stroke-width="2"/><text x="7593" y="21271.9" fill="#a56a25" font-family="Arial, sans-serif" font-size="31"><tspan x="7593" dy="0">Attempt / runtime custody</tspan></text><text x="7593" y="21330.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7593" dy="0">Atomic assignment and generation</tspan><tspan x="7593" dy="33.75">Bounded renewal · restart recovery</tspan><tspan x="7593" dy="33.75">Old workers cannot admit new effects.</tspan><tspan x="7593" dy="33.75">Accepted operations survive takeover.</tspan><tspan x="7593" dy="33.75">Queue delivery does not assign an agent.</tspan></text><text x="6620" y="21680.7" fill="#147b78" font-family="Arial, sans-serif" font-size="23"><tspan x="6620" dy="0">COMMIT BEFORE NOTIFY / ACK AFTER DURABLE CUSTODY</tspan></text><text x="6620" y="21730.7" fill="#147b78" font-family="Arial, sans-serif" font-size="23"><tspan x="6620" dy="0"></tspan></text><rect x="6620.0" y="21765" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="6620.0" y="21765" width="6" height="160" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="6648.0" y="21814.2" fill="#147b78" font-family="Arial, sans-serif" font-size="28"><tspan x="6648.0" dy="0">Transaction</tspan></text><text x="6648.0" y="21875.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648.0" dy="0">State + outbox</tspan></text><rect x="7243.333333333333" y="21765" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="7243.333333333333" y="21765" width="6" height="160" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="7271.333333333333" y="21814.2" fill="#147b78" font-family="Arial, sans-serif" font-size="28"><tspan x="7271.333333333333" dy="0">Publish</tspan></text><text x="7271.333333333333" y="21875.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7271.333333333333" dy="0">Same event ID</tspan></text><rect x="7866.666666666667" y="21765" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="7866.666666666667" y="21765" width="6" height="160" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="7894.666666666667" y="21814.2" fill="#147b78" font-family="Arial, sans-serif" font-size="28"><tspan x="7894.666666666667" dy="0">Consume</tspan></text><text x="7894.666666666667" y="21875.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7894.666666666667" dy="0">Inbox + state → ack</tspan></text><polyline points="7183.333333333333,21845.0 7243.333333333333,21845.0" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="7228.414429781196,21853.15023415627 7243.333333333333,21845.0 7228.414429781196,21836.84976584373" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="7806.666666666666,21845.0 7866.666666666667,21845.0" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="7851.74776311453,21853.15023415627 7866.666666666667,21845.0 7851.74776311453,21836.84976584373" fill="none" stroke="#147b78" stroke-width="3"/><rect x="6620" y="22070" width="1810" height="280" fill="#f2f6f8" stroke="#cad7dd" stroke-width="2"/><rect x="6620" y="22070" width="6" height="280" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="6648" y="22123.7" fill="#2f7959" font-family="Arial, sans-serif" font-size="33"><tspan x="6648" dy="0">Concurrency belongs at the resource owner</tspan></text><text x="6648" y="22180.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648" dy="0">Two tickets can touch the same object: expected revision or serialization resolves conflict.</tspan><tspan x="6648" dy="33.75">An inter-object link does not lock either endpoint. Reject dependency cycles.</tspan><tspan x="6648" dy="33.75">A deterministic reconciler finds expired work and undelivered events; models need not poll.</tspan></text><rect x="6620" y="22500" width="1810" height="170" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="6648" y="22542.7" fill="#2f7959" font-family="Arial, sans-serif" font-size="23"><tspan x="6648" dy="0">FAILURE SPECIMEN</tspan></text><text x="6648" y="22591.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648" dy="0">Race two workers. Resume the stale one. Redeliver the command.</tspan><tspan x="6648" dy="33.75">Only current custody admits new work; the same operation is reconciled after lost replies.</tspan></text></svg>