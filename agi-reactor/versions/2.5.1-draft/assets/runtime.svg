<svg xmlns="http://www.w3.org/2000/svg" viewBox="4500 25980 1950 2250" role="img" aria-label="V3.B5 / Runtime &amp; evolution"><title>V3.B5 / Runtime &amp; evolution</title><desc>Planned architecture. The full contracts and equivalent text are documented on this page.</desc><rect x="4500" y="25980" width="1950" height="2250" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="4500" y="25980" width="1950" height="12" fill="#a56a25" stroke="#a56a25" stroke-width="2"/><text x="4570" y="26071.4" fill="#a56a25" font-family="Arial, sans-serif" font-size="46"><tspan x="4570" dy="0">V3.B5</tspan></text><text x="4570" y="26163.6" fill="#142b38" font-family="Arial, sans-serif" font-size="54"><tspan x="4570" dy="0">Runtime &amp; evolution</tspan></text><text x="4570" y="26223.4" fill="#637680" font-family="Arial, sans-serif" font-size="26"><tspan x="4570" dy="0">Stable service identities. Replaceable implementations.</tspan></text><a href="https://aegises.org/agi-reactor/#architecture"><text x="6050" y="26069.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="6050" dy="0">V3.B / OVERVIEW</tspan></text></a><rect x="4570" y="26330" width="1810" height="260" fill="#faf4e9" stroke="#cad7dd" stroke-width="2"/><rect x="4570" y="26330" width="6" height="260" fill="#a56a25" stroke="#a56a25" stroke-width="2"/><text x="4598" y="26383.7" fill="#a56a25" font-family="Arial, sans-serif" font-size="33"><tspan x="4598" dy="0">Start with a small operational footprint</tspan></text><text x="4598" y="26440.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">NATS + JetStream · transactional control service · compositor · workers · adapters</tspan><tspan x="4598" dy="33.75">Host OS + supervisor isolate, restart and bound processes.</tspan><tspan x="4598" dy="33.75">Split deployments for fault containment, load or independent release—not every noun.</tspan></text><text x="4570" y="26710.7" fill="#2f7959" font-family="Arial, sans-serif" font-size="23"><tspan x="4570" dy="0">REPLACE A SERVICE WITHOUT RESTARTING THE WHOLE SYSTEM</tspan></text><rect x="4570.0" y="26745" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="4570.0" y="26745" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="4598.0" y="26794.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="4598.0" dy="0">Isolate</tspan></text><text x="4598.0" y="26855.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598.0" dy="0">Zero ordinary traffic</tspan></text><rect x="5193.333333333333" y="26745" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="5193.333333333333" y="26745" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="5221.333333333333" y="26794.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="5221.333333333333" dy="0">Qualify</tspan></text><text x="5221.333333333333" y="26855.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5221.333333333333" dy="0">Live canary evidence</tspan></text><rect x="5816.666666666667" y="26745" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="5816.666666666667" y="26745" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="5844.666666666667" y="26794.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="5844.666666666667" dy="0">Ramp</tspan></text><text x="5844.666666666667" y="26855.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5844.666666666667" dy="0">Policy-controlled stages</tspan></text><polyline points="5133.333333333333,26825.0 5193.333333333333,26825.0" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="5178.414429781196,26833.15023415627 5193.333333333333,26825.0 5178.414429781196,26816.84976584373" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="5756.666666666666,26825.0 5816.666666666667,26825.0" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="5801.74776311453,26833.15023415627 5816.666666666667,26825.0 5801.74776311453,26816.84976584373" fill="none" stroke="#2f7959" stroke-width="3"/><text x="4570" y="27050.7" fill="#2f7959" font-family="Arial, sans-serif" font-size="23"><tspan x="4570" dy="0">THE OLD VERSION STAYS HOT THROUGH STABILIZATION</tspan></text><rect x="4570.0" y="27085" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="4570.0" y="27085" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="4598.0" y="27134.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="4598.0" dy="0">Drain</tspan></text><text x="4598.0" y="27195.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598.0" dy="0">Stop new assignment</tspan></text><rect x="5193.333333333333" y="27085" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="5193.333333333333" y="27085" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="5221.333333333333" y="27134.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="5221.333333333333" dy="0">Resume</tspan></text><text x="5221.333333333333" y="27195.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5221.333333333333" dy="0">Durable continuation</tspan></text><rect x="5816.666666666667" y="27085" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="5816.666666666667" y="27085" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="5844.666666666667" y="27134.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="5844.666666666667" dy="0">Stabilize</tspan></text><text x="5844.666666666667" y="27195.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5844.666666666667" dy="0">Compatible state</tspan></text><polyline points="5133.333333333333,27165.0 5193.333333333333,27165.0" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="5178.414429781196,27173.15023415627 5193.333333333333,27165.0 5178.414429781196,27156.84976584373" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="5756.666666666666,27165.0 5816.666666666667,27165.0" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="5801.74776311453,27173.15023415627 5816.666666666667,27165.0 5801.74776311453,27156.84976584373" fill="none" stroke="#2f7959" stroke-width="3"/><rect x="4570" y="27410" width="865" height="350" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="4570" y="27410" width="6" height="350" fill="#a56a25" stroke="#a56a25" stroke-width="2"/><text x="4598" y="27461.9" fill="#a56a25" font-family="Arial, sans-serif" font-size="31"><tspan x="4598" dy="0">Resource stewardship</tspan></text><text x="4598" y="27520.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">Reserve allowance before dispatch.</tspan><tspan x="4598" dy="33.75">Cost / tokens / CPU / memory / time</tspan><tspan x="4598" dy="33.75">Priority · fairness · concurrency limits</tspan><tspan x="4598" dy="33.75">Backpressure · timeout · retry ceiling</tspan><tspan x="4598" dy="33.75">FinOps proposes reviewed refactoring.</tspan></text><rect x="5515" y="27410" width="865" height="350" fill="#edf6f3" stroke="#cad7dd" stroke-width="2"/><rect x="5515" y="27410" width="6" height="350" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="5543" y="27461.9" fill="#2f7959" font-family="Arial, sans-serif" font-size="31"><tspan x="5543" dy="0">Failure containment</tspan></text><text x="5543" y="27520.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5543" dy="0">Failed/stale canary → stop promotion</tspan><tspan x="5543" dy="33.75">Breached criteria → hot fallback</tspan><tspan x="5543" dy="33.75">Expand / migrate / contract schemas</tspan><tspan x="5543" dy="33.75">One operation custodian across versions</tspan><tspan x="5543" dy="33.75">Restore starts with admission disabled.</tspan></text><rect x="4570" y="27960" width="1810" height="170" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="4598" y="28002.7" fill="#a56a25" font-family="Arial, sans-serif" font-size="23"><tspan x="4598" dy="0">VIABLE FIRST / SCALE WHEN THE OUTAGE BUDGET REQUIRES IT</tspan></text><text x="4598" y="28051.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">One recoverable host is not host high availability. Prove backups and restore.</tspan><tspan x="4598" dy="33.75">Broker, database and host maintenance remain separate operational responsibilities.</tspan></text></svg>