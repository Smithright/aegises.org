<svg xmlns="http://www.w3.org/2000/svg" viewBox="4500 20520 1950 2250" role="img" aria-label="V3.B1 / State &amp; meaning"><title>V3.B1 / State &amp; meaning</title><desc>Planned architecture. The full contracts and equivalent text are documented on this page.</desc><rect x="4500" y="20520" width="1950" height="2250" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="4500" y="20520" width="1950" height="12" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="4570" y="20611.4" fill="#147b78" font-family="Arial, sans-serif" font-size="46"><tspan x="4570" dy="0">V3.B1</tspan></text><text x="4570" y="20703.6" fill="#142b38" font-family="Arial, sans-serif" font-size="54"><tspan x="4570" dy="0">State &amp; meaning</tspan></text><text x="4570" y="20763.4" fill="#637680" font-family="Arial, sans-serif" font-size="26"><tspan x="4570" dy="0">Small record vocabulary. Rich domain contracts.</tspan></text><a href="https://aegises.org/agi-reactor/#architecture"><text x="6050" y="20609.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="6050" dy="0">V3.B / OVERVIEW</tspan></text></a><text x="4570" y="20886.0" fill="#147b78" font-family="Arial, sans-serif" font-size="40"><tspan x="4570" dy="0">Three forms. One governed invocation.</tspan></text><rect x="4570" y="20960" width="1810" height="200" fill="#f2f6f8" stroke="#cad7dd" stroke-width="2"/><rect x="4570" y="20960" width="6" height="200" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="4598" y="21013.7" fill="#147b78" font-family="Arial, sans-serif" font-size="33"><tspan x="4598" dy="0">Object / stable identity</tspan></text><text x="4598" y="21070.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">Type · owner · revision · attributed state</tspan><tspan x="4598" dy="33.75">Ticket / agent / service / skill / edict / observation</tspan></text><rect x="4570" y="21210" width="1810" height="200" fill="#f2f6f8" stroke="#cad7dd" stroke-width="2"/><rect x="4570" y="21210" width="6" height="200" fill="#346aa0" stroke="#346aa0" stroke-width="2"/><text x="4598" y="21263.7" fill="#346aa0" font-family="Arial, sans-serif" font-size="33"><tspan x="4598" dy="0">Link / explicit relationship</tspan></text><text x="4598" y="21320.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">Typed endpoints · provenance · revision or time scope</tspan><tspan x="4598" dy="33.75">Assigned to / depends on / supports / contradicts</tspan></text><rect x="4570" y="21460" width="1810" height="200" fill="#f2f6f8" stroke="#cad7dd" stroke-width="2"/><rect x="4570" y="21460" width="6" height="200" fill="#7751a0" stroke="#7751a0" stroke-width="2"/><text x="4598" y="21513.7" fill="#7751a0" font-family="Arial, sans-serif" font-size="33"><tspan x="4598" dy="0">Message / attributed communication</tspan></text><text x="4598" y="21570.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">ID · sender · recipient · causation · body + references</tspan><tspan x="4598" dy="33.75">Chat, command and event share an envelope; semantics differ.</tspan></text><rect x="4570" y="21760" width="1810" height="250" fill="#142b38" stroke="#142b38" stroke-width="2"/><text x="4600" y="21812.5" fill="#b5d7d4" font-family="Arial, sans-serif" font-size="25"><tspan x="4600" dy="0">INVOKE / ONE ENVELOPE, TYPED METHODS</tspan></text><text x="4600" y="21877.9" fill="#ffffff" font-family="Arial, sans-serif" font-size="31"><tspan x="4600" dy="0">Service + method + target + arguments + operation ID</tspan><tspan x="4600" dy="38.75">Caller authority · expected revision · deadline · budget</tspan></text><rect x="4570" y="22100" width="865" height="360" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="4570" y="22100" width="6" height="360" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="4598" y="22151.9" fill="#147b78" font-family="Arial, sans-serif" font-size="31"><tspan x="4598" dy="0">Authoritative state</tspan></text><text x="4598" y="22210.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">One owning service per resource</tspan><tspan x="4598" dy="33.75">Atomic change + outbox event</tspan><tspan x="4598" dy="33.75">Inbox dedup + state commit</tspan><tspan x="4598" dy="33.75">SQL stores objects and graph links.</tspan><tspan x="4598" dy="33.75">Blob stores retain large artifacts.</tspan></text><rect x="5515" y="22100" width="865" height="360" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="5515" y="22100" width="6" height="360" fill="#346aa0" stroke="#346aa0" stroke-width="2"/><text x="5543" y="22151.9" fill="#346aa0" font-family="Arial, sans-serif" font-size="31"><tspan x="5543" dy="0">Derived views</tspan></text><text x="5543" y="22210.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5543" dy="0">World State · search · embeddings</tspan><tspan x="5543" dy="33.75">Source revisions and freshness</tspan><tspan x="5543" dy="33.75">Access before graph traversal</tspan><tspan x="5543" dy="33.75">Unbounded semantics; bounded queries</tspan><tspan x="5543" dy="33.75">Rebuild without becoming authority.</tspan></text><rect x="4570" y="22540" width="1810" height="170" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="4598" y="22582.7" fill="#147b78" font-family="Arial, sans-serif" font-size="23"><tspan x="4598" dy="0">TASTE / COMPRESS PROTOCOLS; PRESERVE MEANING</tspan></text><text x="4598" y="22631.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">A shared record shape never makes a policy, hypothesis and observed result equivalent.</tspan><tspan x="4598" dy="33.75">A service is a stable contract; its process and storage can change.</tspan></text></svg>