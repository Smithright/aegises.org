<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1490" role="img" aria-label="Rules become enforceable decisions"><title>Rules become enforceable decisions</title><desc>Planned architecture. Labels, relationships and evidence limits also appear in the article text.</desc><rect x="0" y="0" width="1600" height="1490" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="0" y="0" width="1600" height="8" fill="#142b38" stroke="#142b38" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="17"><tspan x="48" y="52.15">D3 / REFERENCE DESIGN</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="38"><tspan x="48" y="114.1">Rules become enforceable decisions</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="20"><tspan x="48" y="154.0">One source can create policies, acceptance conditions and reusable guidance. Each follows its own contract.</tspan></text><rect x="48" y="250" width="315" height="140" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="287.8">Edict / source span</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="323.05">Attributed requirement</tspan><tspan x="66" y="347.75">with intended applicability</tspan></text><rect x="478" y="250" width="315" height="140" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="496" y="287.8">Policy candidate</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="496" y="323.05">Typed authorization rules</tspan></text><polyline points="363,320 478,320" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="467.4690092573155,325.75310646325045 478,320 467.4690092573155,314.24689353674955" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="384" y="302.1">propose</tspan></text><rect x="903" y="250" width="315" height="140" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="921" y="287.8">Validate + review</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="921" y="323.05">Schema / tests / impact</tspan><tspan x="921" y="347.75">Authorized approval</tspan></text><polyline points="793,320 903,320" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="892.4690092573155,325.75310646325045 903,320 892.4690092573155,314.24689353674955" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="810" y="302.1">qualify</tspan></text><rect x="1328" y="250" width="224" height="140" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="1346" y="287.8">Active version</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1346" y="323.05">Exact bytes + scope</tspan></text><polyline points="1218,320 1328,320" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="1317.4690092573155,325.75310646325045 1328,320 1317.4690092573155,314.24689353674955" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="1230" y="302.1">activate</tspan></text><rect x="48" y="660" width="315" height="140" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="697.8">Skill / procedure</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="733.05">Versioned guidance</tspan><tspan x="66" y="757.75">+ adoption requirements</tspan></text><polyline points="205,390 205,660" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="199.24689353674955,649.4690092573155 205,660 210.75310646325045,649.4690092573155" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="225" y="527.1">derive guidance</tspan></text><rect x="478" y="660" width="315" height="140" fill="#ffffff" stroke="#a56a25" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="24"><tspan x="496" y="697.8">Acceptance / review</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="496" y="733.05">Task-specific criteria</tspan><tspan x="496" y="757.75">Observed evidence required</tspan></text><polyline points="363,365 412,365 412,620 635,620 635,660" fill="none" stroke="#a56a25" stroke-width="2"/><polyline points="629.2468935367496,649.4690092573155 635,660 640.7531064632504,649.4690092573155" fill="none" stroke="#a56a25" stroke-width="2"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="18"><tspan x="446" y="599.1">derive conditions</tspan></text><rect x="1328" y="660" width="224" height="140" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="1346" y="697.8">Bindings</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1346" y="733.05">Principal / type</tspan><tspan x="1346" y="757.75">Object / action</tspan></text><polyline points="1440,390 1440,660" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="1434.2468935367497,649.4690092573155 1440,660 1445.7531064632503,649.4690092573155" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="1452" y="527.1">bind version</tspan></text><rect x="903" y="660" width="315" height="140" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="921" y="697.8">Policy decision</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="921" y="733.05">Applicable rules + facts</tspan><tspan x="921" y="757.75">Deterministic evaluation</tspan></text><polyline points="1328,730 1218,730" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="1228.5309907426845,724.2468935367496 1218,730 1228.5309907426845,735.7531064632504" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="1244" y="714.1">resolve</tspan></text><rect x="48" y="980" width="315" height="140" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="66" y="1017.8">Compositor</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="66" y="1053.05">Context informs reasoning</tspan><tspan x="66" y="1077.75">It confers no authority.</tspan></text><polyline points="205,800 205,980" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="199.24689353674955,969.4690092573155 205,980 210.75310646325045,969.4690092573155" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="224" y="894.1">compose</tspan></text><rect x="478" y="980" width="315" height="140" fill="#ffffff" stroke="#7751a0" stroke-width="1.5"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="24"><tspan x="496" y="1017.8">Invocation proposal</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="496" y="1053.05">Caller / action / target</tspan><tspan x="496" y="1077.75">OP-9 / argument digest</tspan></text><polyline points="363,1050 478,1050" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="467.4690092573155,1055.7531064632503 478,1050 467.4690092573155,1044.2468935367497" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="387" y="1034.1">inform</tspan></text><polyline points="635,800 635,980" fill="none" stroke="#a56a25" stroke-width="2"/><polyline points="629.2468935367496,969.4690092573155 635,980 640.7531064632504,969.4690092573155" fill="none" stroke="#a56a25" stroke-width="2"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="18"><tspan x="657" y="893.1">acceptance context</tspan></text><rect x="903" y="980" width="315" height="140" fill="#ffffff" stroke="#346aa0" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="24"><tspan x="921" y="1017.8">Service enforcement</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="921" y="1053.05">Decision + current scope</tspan><tspan x="921" y="1077.75">Budget / revision / custody</tspan></text><polyline points="793,1050 903,1050" fill="none" stroke="#7751a0" stroke-width="2"/><polyline points="892.4690092573155,1055.7531064632503 903,1050 892.4690092573155,1044.2468935367497" fill="none" stroke="#7751a0" stroke-width="2"/><text fill="#7751a0" font-family="Arial,sans-serif" font-size="18"><tspan x="810" y="1034.1">request</tspan></text><polyline points="1060,800 1060,980" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="1054.2468935367497,969.4690092573155 1060,980 1065.7531064632503,969.4690092573155" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="1080" y="890.1">evaluate at admission</tspan></text><polyline points="950,980 950,800" fill="none" stroke="#346aa0" stroke-width="2"/><polyline points="955.7531064632504,810.5309907426845 950,800 944.2468935367496,810.5309907426845" fill="none" stroke="#346aa0" stroke-width="2"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="903" y="877.1">facts</tspan></text><polyline points="793,730 840,730 840,1010 903,1010" fill="none" stroke="#a56a25" stroke-width="2" stroke-dasharray="8 6"/><polyline points="892.4690092573155,1015.7531064632504 903,1010 892.4690092573155,1004.2468935367496" fill="none" stroke="#a56a25" stroke-width="2"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="18"><tspan x="848" y="858.1">evidence</tspan></text><rect x="1328" y="980" width="224" height="140" fill="#ffffff" stroke="#147b78" stroke-width="1.5"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="24"><tspan x="1346" y="1017.8">Adapter</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="1346" y="1053.05">Admitted effect</tspan></text><polyline points="1218,1050 1328,1050" fill="none" stroke="#147b78" stroke-width="2"/><polyline points="1317.4690092573155,1055.7531064632503 1328,1050 1317.4690092573155,1044.2468935367497" fill="none" stroke="#147b78" stroke-width="2"/><text fill="#147b78" font-family="Arial,sans-serif" font-size="18"><tspan x="1242" y="1034.1">allow</tspan></text><rect x="903" y="1230" width="649" height="105" fill="#ffffff" stroke="#a56a25" stroke-width="1.5"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="24"><tspan x="921" y="1267.8">Refused / expired / missing required evidence</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="921" y="1303.05">Record the reason. No new external effect.</tspan></text><polyline points="1060,1120 1060,1230" fill="none" stroke="#a56a25" stroke-width="2"/><polyline points="1054.2468935367497,1219.4690092573155 1060,1230 1065.7531064632503,1219.4690092573155" fill="none" stroke="#a56a25" stroke-width="2"/><text fill="#a56a25" font-family="Arial,sans-serif" font-size="18"><tspan x="1084" y="1182.1">deny</tspan></text><rect x="48" y="1230" width="745" height="105" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="1.5"/><text fill="#346aa0" font-family="Arial,sans-serif" font-size="18"><tspan x="68" y="1262.1">RULE CHANGES USE THEIR OWN GOVERNED OPERATIONS</tspan></text><text fill="#142b38" font-family="Arial,sans-serif" font-size="20"><tspan x="68" y="1303.0">Privilege expansion requires distinct author and approver.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="48" y="1398.05">Review is conditional on the governing contract; ordinary requests do not require a universal human approval step.</tspan></text><text fill="#516774" font-family="Arial,sans-serif" font-size="19"><tspan x="48" y="1438.05">Revocation blocks new admission. Accepted operations survive policy changes and require explicit reconciliation.</tspan></text></svg>