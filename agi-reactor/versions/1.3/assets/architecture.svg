<svg xmlns="http://www.w3.org/2000/svg" viewBox="4500 17100 4000 2920" role="img" aria-label="V3.B / AGI Reactor / A viable operating system"><title>V3.B / AGI Reactor / A viable operating system</title><desc>Planned architecture. The full contracts and equivalent text are documented on this page.</desc><rect x="4500" y="17100" width="4000" height="2920" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="4500" y="17100" width="4000" height="12" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="4570" y="17191.4" fill="#147b78" font-family="Arial, sans-serif" font-size="46"><tspan x="4570" dy="0">V3.B</tspan></text><text x="4570" y="17283.6" fill="#142b38" font-family="Arial, sans-serif" font-size="54"><tspan x="4570" dy="0">AGI Reactor / A viable operating system</tspan></text><text x="4570" y="17343.4" fill="#637680" font-family="Arial, sans-serif" font-size="26"><tspan x="4570" dy="0">PARALLEL IMPLEMENTATION VIEW   ·   13 September 2026   ·   Planned architecture</tspan></text><a href="https://aegises.org/agi-reactor/#architecture"><text x="8100" y="17189.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="8100" dy="0">V3.B / OVERVIEW</tspan></text></a><text x="4570" y="17468.2" fill="#142b38" font-family="Arial, sans-serif" font-size="48"><tspan x="4570" dy="0">Know what matters. Keep commitments. Act within bounds.</tspan></text><text x="4570" y="17532.0" fill="#637680" font-family="Arial, sans-serif" font-size="30"><tspan x="4570" dy="0">Persistent agency = coherent knowledge + owned work + explicit authority + allocated resources.</tspan></text><rect x="4570" y="17620" width="3860" height="190" fill="#142b38" stroke="#142b38" stroke-width="2"/><text x="4605" y="17672.5" fill="#b5d7d4" font-family="Arial, sans-serif" font-size="25"><tspan x="4605" dy="0">PEOPLE / ENTERPRISE / AGENTS</tspan></text><text x="4605" y="17736.6" fill="#ffffff" font-family="Arial, sans-serif" font-size="34"><tspan x="4605" dy="0">Purpose · priorities · acceptance · account &amp; organization · pause / cancel · decisions · usable delivery</tspan></text><rect x="4570" y="17925" width="1080" height="730" fill="#f2f6f8" stroke="#cad7dd" stroke-width="2"/><rect x="4570" y="17925" width="6" height="730" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="4598" y="17980.5" fill="#147b78" font-family="Arial, sans-serif" font-size="35"><tspan x="4598" dy="0">01 / Shared state &amp; work</tspan></text><text x="4598" y="18035.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">Objects + typed links + messages</tspan><tspan x="4598" dy="33.75">Tickets · edicts · skills · services</tspan><tspan x="4598" dy="33.75">Single assignee · bounded attempts</tspan><tspan x="4598" dy="33.75">Dependencies · routines · reactions</tspan><tspan x="4598" dy="33.75">Atomic revisions + operation records</tspan><tspan x="4598" dy="33.75">SQL transactions · inbox / outbox</tspan></text><rect x="5830" y="17925" width="1330" height="730" fill="#f5f1fa" stroke="#cad7dd" stroke-width="2"/><rect x="5830" y="17925" width="6" height="730" fill="#7751a0" stroke="#7751a0" stroke-width="2"/><text x="5858" y="17980.5" fill="#7751a0" font-family="Arial, sans-serif" font-size="35"><tspan x="5858" dy="0">02 / Intelligence &amp; continuity</tspan></text><text x="5858" y="18035.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5858" dy="0">Perceive → compose → reason → act</tspan><tspan x="5858" dy="33.75">Evaluate outcomes → consolidate learning</tspan><tspan x="5858" dy="33.75">Authorized, bounded context frames</tspan><tspan x="5858" dy="33.75">Observations ≠ hypotheses ≠ accepted facts</tspan><tspan x="5858" dy="33.75">Models and harnesses are replaceable</tspan><tspan x="5858" dy="33.75">Memory, provenance and contradictions persist</tspan></text><rect x="7340" y="17925" width="1090" height="730" fill="#f2f6f8" stroke="#cad7dd" stroke-width="2"/><rect x="7340" y="17925" width="6" height="730" fill="#346aa0" stroke="#346aa0" stroke-width="2"/><text x="7368" y="17980.5" fill="#346aa0" font-family="Arial, sans-serif" font-size="35"><tspan x="7368" dy="0">03 / Authority &amp; effects</tspan></text><text x="7368" y="18035.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7368" dy="0">Identity · IAM · scoped delegation</tspan><tspan x="7368" dy="33.75">Aegis / policy at service boundaries</tspan><tspan x="7368" dy="33.75">Target revisions · operation identity</tspan><tspan x="7368" dy="33.75">External adapters · result / reconcile</tspan><tspan x="7368" dy="33.75">Secrets · data sovereignty · custody</tspan><tspan x="7368" dy="33.75">Human decisions where required</tspan></text><rect x="4598.0" y="18350" width="321.3333333333333" height="110" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><text x="4616.0" y="18412.1" fill="#147b78" font-family="Arial, sans-serif" font-size="29"><tspan x="4616.0" dy="0">Chat</tspan></text><rect x="4949.333333333333" y="18350" width="321.3333333333333" height="110" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><text x="4967.333333333333" y="18412.1" fill="#147b78" font-family="Arial, sans-serif" font-size="29"><tspan x="4967.333333333333" dy="0">Ticket</tspan></text><rect x="5300.666666666667" y="18350" width="321.3333333333333" height="110" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><text x="5318.666666666667" y="18412.1" fill="#147b78" font-family="Arial, sans-serif" font-size="29"><tspan x="5318.666666666667" dy="0">Result</tspan></text><polyline points="4919.333333333333,18405.0 4949.333333333333,18405.0" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="4934.414429781196,18413.15023415627 4949.333333333333,18405.0 4934.414429781196,18396.84976584373" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="5270.666666666666,18405.0 5300.666666666667,18405.0" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="5285.74776311453,18413.15023415627 5300.666666666667,18405.0 5285.74776311453,18396.84976584373" fill="none" stroke="#147b78" stroke-width="3"/><text x="4598" y="18554.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">One work identity survives execution.</tspan></text><rect x="5858.0" y="18350" width="404.6666666666667" height="110" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><text x="5876.0" y="18412.1" fill="#7751a0" font-family="Arial, sans-serif" font-size="29"><tspan x="5876.0" dy="0">Frame</tspan></text><rect x="6292.666666666667" y="18350" width="404.6666666666667" height="110" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><text x="6310.666666666667" y="18412.1" fill="#7751a0" font-family="Arial, sans-serif" font-size="29"><tspan x="6310.666666666667" dy="0">Model</tspan></text><rect x="6727.333333333333" y="18350" width="404.6666666666667" height="110" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><text x="6745.333333333333" y="18412.1" fill="#7751a0" font-family="Arial, sans-serif" font-size="29"><tspan x="6745.333333333333" dy="0">Lesson</tspan></text><polyline points="6262.666666666667,18405.0 6292.666666666667,18405.0" fill="none" stroke="#7751a0" stroke-width="3"/><polyline points="6277.74776311453,18413.15023415627 6292.666666666667,18405.0 6277.74776311453,18396.84976584373" fill="none" stroke="#7751a0" stroke-width="3"/><polyline points="6697.333333333334,18405.0 6727.333333333333,18405.0" fill="none" stroke="#7751a0" stroke-width="3"/><polyline points="6712.414429781196,18413.15023415627 6727.333333333333,18405.0 6712.414429781196,18396.84976584373" fill="none" stroke="#7751a0" stroke-width="3"/><text x="5858" y="18554.3" fill="#7751a0" font-family="Arial, sans-serif" font-size="27"><tspan x="5858" dy="0">Evidence updates the next invocation.</tspan></text><rect x="7368.0" y="18350" width="324.6666666666667" height="110" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><text x="7386.0" y="18412.1" fill="#346aa0" font-family="Arial, sans-serif" font-size="29"><tspan x="7386.0" dy="0">Admit</tspan></text><rect x="7722.666666666667" y="18350" width="324.6666666666667" height="110" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><text x="7740.666666666667" y="18412.1" fill="#346aa0" font-family="Arial, sans-serif" font-size="29"><tspan x="7740.666666666667" dy="0">Execute</tspan></text><rect x="8077.333333333333" y="18350" width="324.6666666666667" height="110" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><text x="8095.333333333333" y="18412.1" fill="#346aa0" font-family="Arial, sans-serif" font-size="29"><tspan x="8095.333333333333" dy="0">Verify</tspan></text><polyline points="7692.666666666667,18405.0 7722.666666666667,18405.0" fill="none" stroke="#346aa0" stroke-width="3"/><polyline points="7707.74776311453,18413.15023415627 7722.666666666667,18405.0 7707.74776311453,18396.84976584373" fill="none" stroke="#346aa0" stroke-width="3"/><polyline points="8047.333333333334,18405.0 8077.333333333333,18405.0" fill="none" stroke="#346aa0" stroke-width="3"/><polyline points="8062.414429781196,18413.15023415627 8077.333333333333,18405.0 8062.414429781196,18396.84976584373" fill="none" stroke="#346aa0" stroke-width="3"/><text x="7368" y="18554.3" fill="#346aa0" font-family="Arial, sans-serif" font-size="27"><tspan x="7368" dy="0">One operation survives an uncertain reply.</tspan></text><polyline points="5110.0,18655 5110.0,18750" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="5101.849765843728,18735.081096447862 5110.0,18750 5118.150234156272,18735.081096447862" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="6495.0,18655 6495.0,18750" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="6486.849765843728,18735.081096447862 6495.0,18750 6503.150234156272,18735.081096447862" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="7885.0,18655 7885.0,18750" fill="none" stroke="#147b78" stroke-width="3"/><polyline points="7876.849765843728,18735.081096447862 7885.0,18750 7893.150234156272,18735.081096447862" fill="none" stroke="#147b78" stroke-width="3"/><rect x="4570" y="18750" width="3860" height="225" fill="#e0efec" stroke="#bfd8d1" stroke-width="2"/><text x="4605" y="18803.0" fill="#147b78" font-family="Arial, sans-serif" font-size="30"><tspan x="4605" dy="0">NATS / COMMUNICATION KERNEL</tspan></text><text x="4605" y="18874.4" fill="#142b38" font-family="Arial, sans-serif" font-size="36"><tspan x="4605" dy="0">Core: calls + transient signals       JetStream: durable dispatch + committed events + replay</tspan></text><text x="4605" y="18929.2" fill="#147b78" font-family="Arial, sans-serif" font-size="28"><tspan x="4605" dy="0">One invocation contract. Service-owned state and enforcement. Broker delivery is not effect completion.</tspan></text><polyline points="5110,18975 5110,19070" fill="none" stroke="#a56a25" stroke-width="3"/><polyline points="5101.849765843728,19055.081096447862 5110,19070 5118.150234156272,19055.081096447862" fill="none" stroke="#a56a25" stroke-width="3"/><polyline points="6495,18975 6495,19070" fill="none" stroke="#a56a25" stroke-width="3"/><polyline points="6486.849765843728,19055.081096447862 6495,19070 6503.150234156272,19055.081096447862" fill="none" stroke="#a56a25" stroke-width="3"/><polyline points="7885,18975 7885,19070" fill="none" stroke="#a56a25" stroke-width="3"/><polyline points="7876.849765843728,19055.081096447862 7885,19070 7893.150234156272,19055.081096447862" fill="none" stroke="#a56a25" stroke-width="3"/><rect x="4570" y="19070" width="1210" height="375" fill="#faf4e9" stroke="#cad7dd" stroke-width="2"/><rect x="4570" y="19070" width="6" height="375" fill="#a56a25" stroke="#a56a25" stroke-width="2"/><text x="4598" y="19123.7" fill="#a56a25" font-family="Arial, sans-serif" font-size="33"><tspan x="4598" dy="0">04 / Runtime &amp; economics</tspan></text><text x="4598" y="19180.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="4598" dy="0">Host OS + supervisor · isolated workers</tspan><tspan x="4598" dy="33.75">Placement · resource admission · budgets</tspan><tspan x="4598" dy="33.75">Backpressure · health · bounded retries</tspan><tspan x="4598" dy="33.75">Files / models / providers behind services</tspan></text><rect x="5895" y="19070" width="1210" height="375" fill="#edf6f3" stroke="#cad7dd" stroke-width="2"/><rect x="5895" y="19070" width="6" height="375" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="5923" y="19123.7" fill="#2f7959" font-family="Arial, sans-serif" font-size="33"><tspan x="5923" dy="0">05 / Recovery &amp; evolution</tspan></text><text x="5923" y="19180.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="5923" dy="0">Durable continuations · outcome lookup</tspan><tspan x="5923" dy="33.75">Candidate → canary → ramp → stabilize</tspan><tspan x="5923" dy="33.75">Hot fallback + compatible state</tspan><tspan x="5923" dy="33.75">Backup / restore · evaluated improvement</tspan></text><rect x="7220" y="19070" width="1210" height="375" fill="#f2f6f8" stroke="#cad7dd" stroke-width="2"/><rect x="7220" y="19070" width="6" height="375" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="7248" y="19123.7" fill="#147b78" font-family="Arial, sans-serif" font-size="33"><tspan x="7248" dy="0">06 / Shared understanding</tspan></text><text x="7248" y="19180.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7248" dy="0">World State · shell · diagrams · evidence</tspan><tspan x="7248" dy="33.75">Same scoped objects, different views</tspan><tspan x="7248" dy="33.75">Testing · gauntlets · audit · delivery</tspan><tspan x="7248" dy="33.75">FinOps evidence → reviewed refactoring</tspan></text><text x="4570" y="19570.7" fill="#147b78" font-family="Arial, sans-serif" font-size="23"><tspan x="4570" dy="0">EXPLORE THE CONTRACTS</tspan></text><a href="https://aegises.org/agi-reactor/#state"><rect x="4570" y="19600" width="1210" height="83" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/></a><a href="https://aegises.org/agi-reactor/#state"><text x="4590" y="19649.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="4590" dy="0">V3.B1  State &amp; meaning  →</tspan></text></a><a href="https://aegises.org/agi-reactor/#work"><rect x="5895" y="19600" width="1210" height="83" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/></a><a href="https://aegises.org/agi-reactor/#work"><text x="5915" y="19649.3" fill="#2f7959" font-family="Arial, sans-serif" font-size="27"><tspan x="5915" dy="0">V3.B2  Work &amp; concurrency  →</tspan></text></a><a href="https://aegises.org/agi-reactor/#cognition"><rect x="7220" y="19600" width="1210" height="83" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/></a><a href="https://aegises.org/agi-reactor/#cognition"><text x="7240" y="19649.3" fill="#7751a0" font-family="Arial, sans-serif" font-size="27"><tspan x="7240" dy="0">V3.B3  Cognition &amp; learning  →</tspan></text></a><a href="https://aegises.org/agi-reactor/#authority"><rect x="4570" y="19725" width="1210" height="83" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/></a><a href="https://aegises.org/agi-reactor/#authority"><text x="4590" y="19774.3" fill="#346aa0" font-family="Arial, sans-serif" font-size="27"><tspan x="4590" dy="0">V3.B4  Authority &amp; effects  →</tspan></text></a><a href="https://aegises.org/agi-reactor/#runtime"><rect x="5895" y="19725" width="1210" height="83" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/></a><a href="https://aegises.org/agi-reactor/#runtime"><text x="5915" y="19774.3" fill="#a56a25" font-family="Arial, sans-serif" font-size="27"><tspan x="5915" dy="0">V3.B5  Runtime &amp; evolution  →</tspan></text></a><a href="https://aegises.org/agi-reactor/#validation"><rect x="7220" y="19725" width="1210" height="83" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/></a><a href="https://aegises.org/agi-reactor/#validation"><text x="7240" y="19774.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="7240" dy="0">V3.B6  Whole-system trial  →</tspan></text></a><text x="4570" y="19936.1" fill="#147b78" font-family="Arial, sans-serif" font-size="29"><tspan x="4570" dy="0">OBJECT  ·  LINK  ·  MESSAGE   /   INVOKE</tspan></text><a href="https://aegises.org/agi-reactor/#architecture"><text x="7490" y="19935.2" fill="#147b78" font-family="Arial, sans-serif" font-size="28"><tspan x="7490" dy="0">PUBLIC ARCHITECTURE</tspan></text></a></svg>