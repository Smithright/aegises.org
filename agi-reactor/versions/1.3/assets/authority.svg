<svg xmlns="http://www.w3.org/2000/svg" viewBox="6550 23250 1950 2250" role="img" aria-label="V3.B4 / Authority &amp; effects"><title>V3.B4 / Authority &amp; effects</title><desc>Planned architecture. The full contracts and equivalent text are documented on this page.</desc><rect x="6550" y="23250" width="1950" height="2250" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="6550" y="23250" width="1950" height="12" fill="#346aa0" stroke="#346aa0" stroke-width="2"/><text x="6620" y="23341.4" fill="#346aa0" font-family="Arial, sans-serif" font-size="46"><tspan x="6620" dy="0">V3.B4</tspan></text><text x="6620" y="23433.6" fill="#142b38" font-family="Arial, sans-serif" font-size="54"><tspan x="6620" dy="0">Authority &amp; effects</tspan></text><text x="6620" y="23493.4" fill="#637680" font-family="Arial, sans-serif" font-size="26"><tspan x="6620" dy="0">A safe boundary is a contract that rejects and recovers correctly.</tspan></text><a href="https://aegises.org/agi-reactor/#architecture"><text x="8100" y="23339.3" fill="#147b78" font-family="Arial, sans-serif" font-size="27"><tspan x="8100" dy="0">V3.B / OVERVIEW</tspan></text></a><text x="6620" y="23620.7" fill="#346aa0" font-family="Arial, sans-serif" font-size="23"><tspan x="6620" dy="0">SERVICE ADMISSION</tspan></text><rect x="6620.0" y="23655" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="6620.0" y="23655" width="6" height="160" fill="#346aa0" stroke="#346aa0" stroke-width="2"/><text x="6648.0" y="23704.2" fill="#346aa0" font-family="Arial, sans-serif" font-size="28"><tspan x="6648.0" dy="0">Authenticate</tspan></text><text x="6648.0" y="23765.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648.0" dy="0">Principal + scope</tspan></text><rect x="7243.333333333333" y="23655" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="7243.333333333333" y="23655" width="6" height="160" fill="#346aa0" stroke="#346aa0" stroke-width="2"/><text x="7271.333333333333" y="23704.2" fill="#346aa0" font-family="Arial, sans-serif" font-size="28"><tspan x="7271.333333333333" dy="0">Authorize</tspan></text><text x="7271.333333333333" y="23765.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7271.333333333333" dy="0">Action + resource</tspan></text><rect x="7866.666666666667" y="23655" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="7866.666666666667" y="23655" width="6" height="160" fill="#346aa0" stroke="#346aa0" stroke-width="2"/><text x="7894.666666666667" y="23704.2" fill="#346aa0" font-family="Arial, sans-serif" font-size="28"><tspan x="7894.666666666667" dy="0">Own operation</tspan></text><text x="7894.666666666667" y="23765.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7894.666666666667" dy="0">Durable identity</tspan></text><polyline points="7183.333333333333,23735.0 7243.333333333333,23735.0" fill="none" stroke="#346aa0" stroke-width="3"/><polyline points="7228.414429781196,23743.15023415627 7243.333333333333,23735.0 7228.414429781196,23726.84976584373" fill="none" stroke="#346aa0" stroke-width="3"/><polyline points="7806.666666666666,23735.0 7866.666666666667,23735.0" fill="none" stroke="#346aa0" stroke-width="3"/><polyline points="7851.74776311453,23743.15023415627 7866.666666666667,23735.0 7851.74776311453,23726.84976584373" fill="none" stroke="#346aa0" stroke-width="3"/><rect x="6620" y="23960" width="865" height="360" fill="#f2f6f8" stroke="#cad7dd" stroke-width="2"/><rect x="6620" y="23960" width="6" height="360" fill="#346aa0" stroke="#346aa0" stroke-width="2"/><text x="6648" y="24011.9" fill="#346aa0" font-family="Arial, sans-serif" font-size="31"><tspan x="6648" dy="0">Aegis / enforced boundary</tspan></text><text x="6648" y="24070.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648" dy="0">IAM · delegation · expiry · revocation</tspan><tspan x="6648" dy="33.75">Object and account policy at invocation</tspan><tspan x="6648" dy="33.75">Type/class bindings resolve applicability.</tspan><tspan x="6648" dy="33.75">NATS permissions constrain transport.</tspan><tspan x="6648" dy="33.75">An authenticated sender may still be denied.</tspan></text><rect x="7565" y="23960" width="865" height="360" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="7565" y="23960" width="6" height="360" fill="#147b78" stroke="#147b78" stroke-width="2"/><text x="7593" y="24011.9" fill="#147b78" font-family="Arial, sans-serif" font-size="31"><tspan x="7593" dy="0">Enterprise governance</tspan></text><text x="7593" y="24070.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7593" dy="0">Law / standard → enforceable policy</tspan><tspan x="7593" dy="33.75">SOP / guideline → bounded procedure</tspan><tspan x="7593" dy="33.75">Examples remain reference material.</tspan><tspan x="7593" dy="33.75">Approval has scope and conditions.</tspan><tspan x="7593" dy="33.75">Privileged changes need separate authority.</tspan></text><text x="6620" y="24440.7" fill="#a56a25" font-family="Arial, sans-serif" font-size="23"><tspan x="6620" dy="0">SANDBOX → CONTROLLED CROSSING → EXTERNAL DESTINATION</tspan></text><text x="6620" y="24480.7" fill="#2f7959" font-family="Arial, sans-serif" font-size="23"><tspan x="6620" dy="0"></tspan></text><rect x="6620.0" y="24515" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="6620.0" y="24515" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="6648.0" y="24564.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="6648.0" dy="0">Worker</tspan></text><text x="6648.0" y="24625.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648.0" dy="0">No raw egress</tspan></text><rect x="7243.333333333333" y="24515" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="7243.333333333333" y="24515" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="7271.333333333333" y="24564.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="7271.333333333333" dy="0">Aegis / adapter</tspan></text><text x="7271.333333333333" y="24625.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7271.333333333333" dy="0">Action + release policy</tspan></text><rect x="7866.666666666667" y="24515" width="563.3333333333334" height="160" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/><rect x="7866.666666666667" y="24515" width="6" height="160" fill="#2f7959" stroke="#2f7959" stroke-width="2"/><text x="7894.666666666667" y="24564.2" fill="#2f7959" font-family="Arial, sans-serif" font-size="28"><tspan x="7894.666666666667" dy="0">Target / model</tspan></text><text x="7894.666666666667" y="24625.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="7894.666666666667" dy="0">Result or UNKNOWN</tspan></text><polyline points="7183.333333333333,24595.0 7243.333333333333,24595.0" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="7228.414429781196,24603.15023415627 7243.333333333333,24595.0 7228.414429781196,24586.84976584373" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="7806.666666666666,24595.0 7866.666666666667,24595.0" fill="none" stroke="#2f7959" stroke-width="3"/><polyline points="7851.74776311453,24603.15023415627 7866.666666666667,24595.0 7851.74776311453,24586.84976584373" fill="none" stroke="#2f7959" stroke-width="3"/><rect x="6620" y="24800" width="1810" height="310" fill="#faf4e9" stroke="#cad7dd" stroke-width="2"/><rect x="6620" y="24800" width="6" height="310" fill="#a56a25" stroke="#a56a25" stroke-width="2"/><text x="6648" y="24853.7" fill="#a56a25" font-family="Arial, sans-serif" font-size="33"><tspan x="6648" dy="0">Lost reply is not permission to repeat</tspan></text><text x="6648" y="24910.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648" dy="0">Reuse target idempotency keys where supported. Otherwise query the original operation.</tspan><tspan x="6648" dy="33.75">If the target cannot deduplicate or reveal outcome, stop retries and retain UNKNOWN.</tspan><tspan x="6648" dy="33.75">Already admitted effects may finish after a pause or reassignment. Show that state.</tspan><tspan x="6648" dy="33.75">Operation IDs bind immutable intent; scoped egress prevents bypass and data leakage.</tspan></text><rect x="6620" y="25260" width="1810" height="170" fill="#f2f6f8" stroke="#f2f6f8" stroke-width="2"/><text x="6648" y="25302.7" fill="#346aa0" font-family="Arial, sans-serif" font-size="23"><tspan x="6648" dy="0">THREAT MODEL / ENFORCEMENT BELOW THE MODEL</tspan></text><text x="6648" y="25351.3" fill="#142b38" font-family="Arial, sans-serif" font-size="27"><tspan x="6648" dy="0">Sandbox workers; govern model submission, tool access and information release.</tspan><tspan x="6648" dy="33.75">Separate authority governs changes to policy, budgets and the enforcing controls.</tspan></text></svg>