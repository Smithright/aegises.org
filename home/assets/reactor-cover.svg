<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">Governed action, from request to receipt</title><desc id="desc">Conceptual illustration: a request passes a policy boundary before permitted action. Evidence supports review and recovery. The complete Reactor article defines the contracts.</desc><rect width="720" height="440" fill="#102c39"/><g fill="none" stroke="#294956" stroke-width="1"><path d="M40 70H680M40 370H680M110 40V400M610 40V400"/><circle cx="360" cy="218" r="167"/><circle cx="360" cy="218" r="133"/></g><g font-family="Arial,sans-serif"><text x="40" y="41" fill="#91b1ba" font-size="11" letter-spacing="2">A CONCEPTUAL VIEW OF GOVERNED ACTION</text><g stroke="#6c969d" fill="none" stroke-width="1.5"><path d="M164 204H242M376 204H452M554 244V319H310V247"/><path d="m232 199 10 5-10 5m210-5 10 5-10 5m-147 68 5-10 5 10"/></g><rect x="47" y="165" width="117" height="80" fill="#173947" stroke="#557580"/><text x="105" y="199" font-size="11" fill="#91b1ba" text-anchor="middle" letter-spacing="1">01</text><text x="105" y="223" font-size="19" fill="#f5f6f0" text-anchor="middle">Request</text><rect x="242" y="148" width="134" height="112" fill="#173f48" stroke="#43c1b5" stroke-width="2"/><text x="309" y="180" font-size="11" fill="#43c1b5" text-anchor="middle" letter-spacing="1">02 · AUTHORITY</text><text x="309" y="215" font-size="27" fill="#f5f6f0" text-anchor="middle">Policy</text><text x="309" y="241" font-size="12" fill="#a9c7cb" text-anchor="middle">Permit or deny</text><rect x="452" y="165" width="212" height="80" fill="#173947" stroke="#557580"/><text x="558" y="196" font-size="11" fill="#91b1ba" text-anchor="middle" letter-spacing="1">03</text><text x="558" y="223" font-size="21" fill="#f5f6f0" text-anchor="middle">Permitted action</text><rect x="389" y="303" width="111" height="31" fill="#102c39"/><text x="444" y="325" font-size="14" fill="#43c1b5" text-anchor="middle">Evidence</text><text x="310" y="350" font-size="12" fill="#91b1ba">Review &amp; recovery</text><text x="40" y="405" fill="#91b1ba" font-size="12">Explicit authority. Attributable effects. Recoverable work.</text></g></svg>
